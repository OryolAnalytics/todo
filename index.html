<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>To do</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#F1F0EA">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="To do">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" href="./icon-192.png">
<style>
  /* ---------------------------------------------------------------
     Gestaltung: warmes Papier, ruhige Karten, Serifen für Überschriften.
     Alle Farben als Variablen, damit der Dunkelmodus nur sie austauscht.
     --------------------------------------------------------------- */
  :root{
    --schrift:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    --schrift-ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --schrift-titel:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;

    --papier:#F1F0EA;      /* Hintergrund der Seite */
    --karte:#F7F6F1;       /* Flächen, die darauf liegen */
    --feld:#FDFCF9;        /* Eingabefelder */
    --tinte:#1D1C19;
    --grau:#716D64;
    --linie:#E0DDD2;
    --auswahl:#E5E8DF;     /* sanftes Salbei für Aktives */
    --akzent:#4C6B50;
    --warn:#A4453A;
    --gut:#3F7047;
    --schleier:rgba(28,26,20,.34);
    --schatten:0 1px 2px rgba(40,36,25,.05);
    --rund:14px;
  }
  html[data-schrift="sans"]{ --schrift:var(--schrift-ui) }
  html[data-schrift="times"]{ --schrift:"Times New Roman",Times,"Liberation Serif",serif;
                              --schrift-titel:"Times New Roman",Times,"Liberation Serif",serif }

  html[data-thema="dunkel"]{
    --papier:#15150F;
    --karte:#1C1C16;
    --feld:#22221B;
    --tinte:#EDEBE1;
    --grau:#938E82;
    --linie:#2E2E26;
    --auswahl:#2A3129;
    --akzent:#9CBCA0;
    --warn:#D9897D;
    --gut:#8FBE96;
    --schleier:rgba(0,0,0,.6);
    --schatten:0 1px 2px rgba(0,0,0,.3);
    color-scheme:dark;
  }
  /* Bereichsfarben sind für helles Papier gewählt; dunkel brauchen sie Leuchtkraft */
  html[data-thema="dunkel"] .punkt,
  html[data-thema="dunkel"] .kasten,
  html[data-thema="dunkel"] .farbe{filter:brightness(1.45) saturate(1.05)}

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--papier)}
  body{
    font-family:var(--schrift);
    color:var(--tinte);font-size:17px;line-height:1.45;
    min-height:100vh;
    padding:18px 16px calc(150px + env(safe-area-inset-bottom));
    display:flex;justify-content:center;
    -webkit-font-smoothing:antialiased;
  }
  .rahmen{width:100%;max-width:680px}
  aside{display:none}
  .wrap{width:100%}
  button,input,select,textarea{font-family:inherit;color:inherit}

  /* ---------- Kopf (Handy) ---------- */
  .kopf{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
  .logo{display:inline-block;cursor:pointer;font-family:var(--schrift-titel)}
  .logo span{font-size:27px;line-height:1;letter-spacing:.14em;display:block;font-weight:400}
  .logo i{display:none}
  .zahn{background:none;border:0;padding:8px;margin-right:-8px;cursor:pointer;color:var(--grau);
        line-height:0;border-radius:50%}
  .zahn:hover{background:var(--karte);color:var(--tinte)}
  .zahn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.6}

  /* ---------- Reiter als Pillen ---------- */
  nav{display:flex;gap:7px;margin-bottom:16px;overflow-x:auto;scrollbar-width:none;
      padding-bottom:2px;-webkit-overflow-scrolling:touch}
  nav::-webkit-scrollbar{display:none}
  nav button{
    background:none;border:1px solid var(--linie);border-radius:999px;
    padding:6px 14px;cursor:pointer;white-space:nowrap;
    font-family:var(--schrift-ui);font-size:14px;color:var(--grau);
    transition:background .12s,color .12s,border-color .12s;
  }
  nav button:hover{color:var(--tinte)}
  nav button[aria-current="true"]{background:var(--auswahl);border-color:transparent;color:var(--akzent)}

  /* ---------- Karten ---------- */
  .karte{
    background:var(--karte);border:1px solid var(--linie);border-radius:var(--rund);
    padding:16px 18px;margin-bottom:14px;box-shadow:var(--schatten);
  }
  .karte>h2{margin:0 0 4px}
  h2{
    font-family:var(--schrift-titel);font-size:20px;font-weight:400;letter-spacing:-.01em;
    color:var(--tinte);margin:0 0 6px;
  }
  h2 em{font-style:normal;font-size:14px;color:var(--grau);margin-left:8px;font-family:var(--schrift-ui)}
  .karte.dringend{border-color:color-mix(in srgb,var(--warn) 40%,var(--linie))}
  .karte.dringend>h2{color:var(--warn)}

  /* ---------- Aufgaben ---------- */
  ul{list-style:none;margin:0;padding:0}
  li.auf{display:flex;align-items:flex-start;gap:11px;padding:11px 0;cursor:pointer;
         border-bottom:1px solid var(--linie)}
  li.auf:last-child{border-bottom:0;padding-bottom:2px}
  .kasten{
    flex:0 0 auto;width:19px;height:19px;margin-top:3px;border:1.5px solid var(--grau);
    background:var(--feld);cursor:pointer;padding:0;position:relative;border-radius:6px;
    transition:background .14s,border-color .14s;
  }
  .kasten::after{
    content:"";position:absolute;left:5px;top:2px;width:5px;height:10px;
    border:solid var(--feld);border-width:0 2px 2px 0;transform:rotate(42deg) scale(0);
    transition:transform .16s ease;
  }
  li.fertig .kasten::after{transform:rotate(42deg) scale(1)}
  .kasten::before{content:"";position:absolute;left:-10px;right:-8px;top:-10px;bottom:-10px}
  .mitte{flex:1;min-width:0}
  .titel{word-break:break-word;line-height:1.35}
  li.fertig .titel{color:var(--grau);text-decoration:line-through}
  li.auf.istwichtig .titel{font-weight:600}
  .unten{font-family:var(--schrift-ui);font-size:12.5px;color:var(--grau);margin-top:3px;
         display:flex;gap:9px;flex-wrap:wrap;align-items:center}
  .bereichs-tag{display:inline-flex;align-items:center;gap:5px}
  .punkt{width:8px;height:8px;border-radius:50%;flex:0 0 auto;display:inline-block}
  .faellig.warn{color:var(--warn)}
  .faellig.heute{color:var(--tinte)}
  .notizzeichen{font-style:italic}

  .stern{flex:0 0 auto;background:none;border:0;padding:4px 2px;cursor:pointer;align-self:center;
         color:var(--linie);line-height:0}
  .stern svg{width:16px;height:16px;fill:currentColor}
  .stern.an{color:#C79A2E}
  .stern:hover{color:var(--grau)}
  .stern.an:hover{color:#AD8524}

  .griff{flex:0 0 auto;background:none;border:0;padding:6px 0 6px 6px;cursor:grab;
         touch-action:none;opacity:.4;align-self:center;color:var(--grau)}
  .griff:active{cursor:grabbing;opacity:1}
  .griff svg{width:14px;height:17px;display:block;fill:currentColor}
  li.auf.zieht{opacity:.5;background:var(--feld);border-radius:8px}

  .ton{flex:0 0 auto;width:28px;height:28px;border-radius:50%;border:1px solid var(--linie);
       background:var(--feld);cursor:pointer;display:grid;place-items:center;margin-top:1px;color:var(--tinte)}
  .ton svg{width:11px;height:11px;fill:currentColor}
  .ton.laeuft{background:var(--akzent);color:var(--karte);border-color:var(--akzent)}

  .kill{flex:0 0 auto;background:none;border:0;color:var(--grau);cursor:pointer;
        font-size:19px;line-height:1;padding:2px 4px;opacity:.5}
  .kill:hover{opacity:1;color:var(--warn)}

  /* ---------- Bereiche und Serien ---------- */
  li.bereich{display:flex;align-items:center;gap:12px;padding:12px 0;cursor:pointer;
             border-bottom:1px solid var(--linie)}
  li.bereich:last-child{border-bottom:0}
  li.bereich .punkt{width:12px;height:12px}
  li.bereich .nam{flex:1;font-size:18px}
  li.bereich .anz{color:var(--grau);font-size:14px;font-family:var(--schrift-ui)}
  .stift{background:none;border:0;color:var(--grau);cursor:pointer;font-size:13px;padding:4px;
         font-family:var(--schrift-ui)}
  .stift:hover{color:var(--tinte)}
  li.serie{padding:12px 0;cursor:pointer;border-bottom:1px solid var(--linie)}
  li.serie:last-child{border-bottom:0}
  li.serie .kopfz{display:flex;gap:10px;align-items:center}
  li.serie .kopfz .nam{flex:1}

  /* ---------- Leere Zustände ---------- */
  .leer{padding:30px 2px;color:var(--grau);font-family:var(--schrift-ui);font-size:14.5px}
  .leer b{display:block;color:var(--tinte);font-weight:400;font-size:19px;margin-bottom:5px;
          font-family:var(--schrift-titel)}
  .nix{margin:0;color:var(--grau);font-size:14.5px;font-family:var(--schrift-ui)}

  .zurueck{background:none;border:0;color:var(--grau);cursor:pointer;padding:0 0 12px;
           font-size:14px;font-family:var(--schrift-ui)}
  .zurueck:hover{color:var(--tinte)}
  .titelzeile{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .titelzeile h1{font-family:var(--schrift-titel);font-size:25px;font-weight:400;margin:0;flex:1}

  /* ---------- Knöpfe ---------- */
  .knopf{
    background:var(--feld);border:1px solid var(--linie);border-radius:999px;padding:8px 16px;
    font-family:var(--schrift-ui);font-size:14px;cursor:pointer;color:var(--tinte);
    transition:border-color .12s,background .12s;
  }
  .knopf:hover{border-color:var(--grau)}
  .knopf.voll{background:var(--akzent);border-color:var(--akzent);color:#fff}
  .knopf.voll:hover{filter:brightness(1.08)}
  .knopf.leise{color:var(--grau)}
  .knopf.leise:hover{color:var(--warn);border-color:var(--warn)}
  .knopfreihe{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}

  /* ---------- Eingabeleiste ---------- */
  .leiste{
    position:fixed;left:0;right:0;bottom:0;background:var(--papier);
    padding:10px 16px calc(12px + env(safe-area-inset-bottom));display:flex;justify-content:center;
    border-top:1px solid var(--linie);
  }
  .leiste-inner{width:100%;max-width:680px}
  .ziel{display:flex;align-items:center;gap:7px;font-family:var(--schrift-ui);font-size:12.5px;
        color:var(--grau);background:none;border:0;padding:0 0 8px;cursor:pointer}
  .ziel em{font-style:normal;opacity:.65;margin-left:2px}
  .reihe{display:flex;gap:9px;align-items:center}
  input[type=text],input[type=date],input[type=time],input[type=number],select,textarea{
    width:100%;font-size:16px;background:var(--feld);border:1px solid var(--linie);
    border-radius:11px;padding:11px 13px;outline:none;font-family:var(--schrift-ui);
    transition:border-color .12s;
  }
  .reihe input[type=text]{border-radius:999px;padding:12px 17px}
  input:focus,select:focus,textarea:focus{border-color:var(--akzent)}
  textarea{resize:vertical;min-height:80px;line-height:1.45}
  .mik{
    flex:0 0 auto;width:46px;height:46px;border-radius:50%;background:var(--akzent);border:0;
    cursor:pointer;position:relative;display:grid;place-items:center;color:#fff;
  }
  .mik svg{width:19px;height:19px;position:relative;z-index:1}
  .mik .welle{position:absolute;inset:0;border-radius:50%;background:var(--warn);opacity:0}
  .mik.an{background:var(--warn)}
  .mik.an .welle{animation:welle 1.5s ease-out infinite}
  @keyframes welle{0%{transform:scale(1);opacity:.5}100%{transform:scale(1.7);opacity:0}}
  .ton-knopf{width:42px;height:42px;background:var(--feld);border:1px solid var(--linie);color:var(--warn)}
  .ton-knopf svg{width:15px;height:15px}
  .ton-knopf.nimmt{background:var(--warn);border-color:var(--warn);color:#fff}
  .mitschrift{font-style:italic;color:var(--grau);font-size:14px;padding:0 0 6px;
              font-family:var(--schrift-ui)}
  .aufnahmebalken{display:flex;align-items:center;gap:9px;font-size:14px;color:var(--warn);
                  font-style:normal;padding:0 0 8px}
  .aufnahmebalken .pkt{width:8px;height:8px;border-radius:50%;background:var(--warn);animation:blink 1s infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

  /* ---------- Dialogblatt ---------- */
  .schleier{position:fixed;inset:0;background:var(--schleier);display:none;z-index:20;
            backdrop-filter:blur(2px)}
  .schleier.auf{display:block}
  .blatt{
    position:fixed;left:0;right:0;bottom:0;background:var(--karte);z-index:21;
    border-radius:18px 18px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));
    max-height:88vh;overflow-y:auto;transform:translateY(100%);
    visibility:hidden;transition:transform .24s cubic-bezier(.32,.72,0,1),visibility .24s;
    box-shadow:0 -8px 32px rgba(40,36,25,.14);
  }
  .blatt.auf{transform:none;visibility:visible}
  .blatt.taub{pointer-events:none}
  @media(min-width:680px){
    .blatt{left:50%;right:auto;bottom:auto;top:50%;width:540px;max-width:92vw;
           transform:translate(-50%,-46%) scale(.98);opacity:0;border-radius:16px;
           visibility:hidden;transition:transform .18s ease,opacity .18s ease,visibility .18s}
    .blatt.auf{transform:translate(-50%,-50%) scale(1);opacity:1;visibility:visible}
  }
  .blatt h3{font-family:var(--schrift-titel);font-size:21px;font-weight:400;margin:0 0 16px}
  label{display:block;font-family:var(--schrift-ui);font-size:12.5px;color:var(--grau);
        margin:16px 0 6px;letter-spacing:.02em}
  label:first-of-type{margin-top:0}
  .farben{display:flex;gap:9px;flex-wrap:wrap}
  .farbe{width:32px;height:32px;border-radius:50%;border:2px solid var(--karte);cursor:pointer;
         box-shadow:0 0 0 1px var(--linie)}
  .farbe[aria-pressed="true"]{box-shadow:0 0 0 2px var(--tinte)}
  .wahl{display:flex;gap:7px}
  .wahl button{
    flex:1;background:var(--feld);border:1px solid var(--linie);border-radius:11px;
    padding:10px;font-size:15px;cursor:pointer;color:var(--grau);
  }
  .wahl button[aria-pressed="true"]{border-color:var(--akzent);color:var(--akzent);background:var(--auswahl)}
  input:disabled{color:var(--grau);opacity:.7;cursor:not-allowed}
  .schnell{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
  .schnell button{background:var(--feld);border:1px solid var(--linie);border-radius:999px;
                  padding:6px 13px;font-family:var(--schrift-ui);font-size:13px;cursor:pointer;color:var(--grau)}
  .schnell button:hover{color:var(--tinte);border-color:var(--grau)}
  .zwei{display:flex;gap:9px}
  .zwei>*{flex:1}
  .hinweis{font-family:var(--schrift-ui);font-size:13px;color:var(--grau);margin:10px 0 0;line-height:1.45}

  /* ---------- Bänder und Statuszeile ---------- */
  .band{
    position:fixed;left:0;right:0;top:0;z-index:25;display:none;
    padding:calc(9px + env(safe-area-inset-top)) 16px 9px;text-align:center;
    font-family:var(--schrift-ui);font-size:13px;background:var(--karte);color:var(--grau);
    border-bottom:1px solid var(--linie);
  }
  .band.auf{display:block}
  .band.neu{background:var(--akzent);color:#fff;border-bottom-color:var(--akzent)}
  .band button{margin-left:10px;background:none;border:1px solid rgba(255,255,255,.6);color:#fff;
               border-radius:999px;padding:3px 12px;font-size:13px;cursor:pointer}
  .status{position:fixed;left:0;right:0;bottom:calc(96px + env(safe-area-inset-bottom));
          text-align:center;font-family:var(--schrift-ui);font-size:13px;color:var(--grau);
          pointer-events:none;z-index:30;padding:0 18px}

  /* ---------- Notizen, Suche, Dateien ---------- */
  #notizfeld{
    width:100%;min-height:calc(100vh - 320px);font-size:16.5px;line-height:1.6;
    background:transparent;border:0;padding:0;outline:none;resize:none;font-family:var(--schrift);
  }
  #suchfeld{margin-bottom:12px;border-radius:999px;padding:12px 17px}
  .trefferzeile{padding:12px 0;color:var(--grau);cursor:pointer;font-size:15px}
  .trefferzeile:hover{color:var(--tinte)}

  .ablage{
    border:1.5px dashed var(--linie);border-radius:var(--rund);padding:26px 18px;text-align:center;
    cursor:pointer;margin-bottom:14px;transition:border-color .14s,background .14s;
  }
  .ablage:hover,.ablage.drueber{border-color:var(--akzent);background:var(--karte)}
  .ablage b{display:block;font-family:var(--schrift-titel);font-weight:400;font-size:19px;margin-bottom:4px}
  .ablage span{font-family:var(--schrift-ui);font-size:13px;color:var(--grau)}
  .ladezeile{padding:10px 0;font-family:var(--schrift-ui);font-size:13px;color:var(--grau)}
  .balken{height:3px;background:var(--linie);border-radius:2px;margin-top:7px;overflow:hidden}
  .balken i{display:block;height:100%;background:var(--akzent);width:0;transition:width .2s}
  ul.dateiliste li{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid var(--linie)}
  ul.dateiliste li:last-child{border-bottom:0}
  .d-mitte{flex:1;min-width:0}
  .d-name{word-break:break-all;font-size:16px}
  .d-hol{background:var(--feld);border:1px solid var(--linie);border-radius:999px;padding:5px 13px;
         font-family:var(--schrift-ui);font-size:13px;cursor:pointer;color:var(--tinte);flex:0 0 auto}
  .d-hol:hover{border-color:var(--grau)}

  /* ---------- Dashboard ---------- */
  .brett-kopf{display:flex;align-items:baseline;justify-content:space-between;gap:20px;
              flex-wrap:wrap;margin-bottom:20px}
  .brett-kopf .gross{font-family:var(--schrift-titel);font-size:31px;margin-right:10px;letter-spacing:-.015em}
  .brett-kopf .klein{color:var(--grau);font-size:16px}
  .zahlen{display:flex;gap:20px;flex-wrap:wrap;font-family:var(--schrift-ui)}
  .zahlen .z{color:var(--grau);font-size:13px}
  .zahlen .z b{font-family:var(--schrift-titel);font-size:23px;color:var(--tinte);margin-right:6px;font-weight:400}
  .zahlen .z.warn b{color:var(--warn)}
  .zahlen .z.gut b{color:var(--gut)}
  .raster{display:flex;gap:14px;align-items:flex-start}
  .spalte{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:14px}
  .kachel{border:1px solid var(--linie);border-radius:var(--rund);padding:15px 17px 14px;
          background:var(--karte);box-shadow:var(--schatten)}
  .kachel.dringend{border-color:color-mix(in srgb,var(--warn) 40%,var(--linie))}
  .kachel h3{margin:0 0 10px;font-family:var(--schrift-ui);font-size:11.5px;font-weight:600;
             text-transform:uppercase;letter-spacing:.09em;color:var(--grau)}
  .kachel.dringend h3{color:var(--warn)}
  .kachel .zeile{margin:0;font-size:15.5px;line-height:1.5;white-space:pre-wrap;cursor:pointer}
  ul.knapp li{display:flex;align-items:center;gap:9px;padding:7px 0;cursor:pointer;
              border-bottom:1px solid var(--linie)}
  ul.knapp li:last-child{border-bottom:0;padding-bottom:0}
  ul.knapp .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15.5px}
  ul.knapp .n{flex:0 0 auto;color:var(--grau);font-size:12.5px;font-family:var(--schrift-ui)}
  ul.knapp .kasten{width:16px;height:16px;margin-top:0}
  ul.knapp .kasten::after{left:4px;top:2px;width:4px;height:8px}
  ul.knapp .ton{width:23px;height:23px;margin-top:0}
  ul.knapp .ton svg{width:10px;height:10px}
  .ministern{color:#C79A2E;margin-right:5px}
  .rahmen.weit{max-width:none}

  /* ---------- Rechner: Seitenleiste ---------- */
  @media(min-width:900px){
    body{padding:0;height:100vh;overflow:hidden;align-items:stretch}
    .rahmen{max-width:1240px;height:100vh;display:flex}
    .haupt{flex:1;min-width:0;display:flex;flex-direction:column;height:100vh}
    .wrap{flex:1;min-height:0;overflow-y:auto;padding:32px 36px 44px;max-width:none}
    .rahmen.weit .wrap{padding:32px 36px 44px}
    .kopf,nav{display:none}
    aside{
      display:flex;flex-direction:column;flex:0 0 232px;width:232px;height:100vh;
      border-right:1px solid var(--linie);padding:30px 14px 18px;overflow-y:auto;
    }
    .s-logo{cursor:pointer;font-family:var(--schrift-titel);font-size:25px;letter-spacing:.16em;
            padding:0 10px;margin-bottom:28px;line-height:1}
    .s-nav{display:flex;flex-direction:column;gap:1px}
    .s-nav button{
      display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:none;
      border:0;padding:8px 10px;border-radius:9px;cursor:pointer;font-size:16px;color:var(--tinte);
      font-family:var(--schrift-ui);transition:background .12s;
    }
    .s-nav button:hover{background:var(--karte)}
    .s-nav button[aria-current="true"]{background:var(--auswahl);color:var(--akzent)}
    .s-nav button .sym{flex:0 0 auto;width:17px;height:17px;color:var(--grau);line-height:0}
    .s-nav button .sym svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.6;
                           stroke-linecap:round;stroke-linejoin:round}
    .s-nav button[aria-current="true"] .sym{color:var(--akzent)}
    .s-nav button .nam{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .s-nav button em{font-style:normal;font-size:13px;color:var(--grau)}
    .s-titel{
      display:flex;align-items:center;justify-content:space-between;margin:26px 0 7px;padding:0 10px;
      font-family:var(--schrift-ui);font-size:11px;font-weight:600;text-transform:uppercase;
      letter-spacing:.09em;color:var(--grau);
    }
    .s-titel button{background:none;border:0;cursor:pointer;color:var(--grau);font-size:17px;
                    line-height:1;padding:0 4px}
    .s-titel button:hover{color:var(--tinte)}
    .s-fuss{margin-top:auto;padding-top:16px;border-top:1px solid var(--linie)}
    .s-fuss button{background:none;border:0;cursor:pointer;color:var(--grau);font-size:14px;
                   padding:7px 10px;text-align:left;width:100%;border-radius:9px;font-family:var(--schrift-ui)}
    .s-fuss button:hover{background:var(--karte);color:var(--tinte)}
    .leiste{position:static;padding:12px 36px 22px;flex:0 0 auto;border-top:1px solid var(--linie)}
    .leiste-inner{max-width:none}
    .status{bottom:auto;top:18px;right:26px;left:auto;text-align:right}
    #notizfeld{min-height:calc(100vh - 230px)}
  }

  :focus-visible{outline:2px solid var(--akzent);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<input type="file" id="dateiwahl" multiple hidden>
<input type="file" id="fotowahl" accept="image/*" capture="environment" hidden>

<script>
"use strict";

/* ============ Speicher ============ */
const LS = (() => {
  try { localStorage.setItem('_p','1'); localStorage.removeItem('_p'); return localStorage; }
  catch(e){ const m={}; return {getItem:k=>k in m?m[k]:null,setItem:(k,v)=>{m[k]=String(v)}}; }
})();
const DOC_KEY='todo.doc.v1', CFG_KEY='todo.cfg.v1';

const FARBEN=['#B03A2E','#CA6F1E','#B7950B','#1E8449','#0E8074','#1F6FB2','#34495E','#6C3483','#A5468B','#5D6D7E'];

let doc={bereiche:[],aufgaben:[],vorlagen:[],notiz:{text:'',ts:0},dateien:[]};
let cfg={url:'',key:'',code:'',ziel:null,ansicht:'heute',thema:'hell',schrift:'serif',vapid:'',push:false};
let ansicht='heute', offenerBereich=null, notizUhr=null;

try{ const d=JSON.parse(LS.getItem(DOC_KEY)); if(d&&typeof d==='object') doc={bereiche:d.bereiche||[],aufgaben:d.aufgaben||[],vorlagen:d.vorlagen||[],notiz:(d.notiz&&typeof d.notiz==='object')?d.notiz:{text:'',ts:0},dateien:d.dateien||[]}; }catch(e){}
try{ const c=JSON.parse(LS.getItem(CFG_KEY)); if(c&&typeof c==='object') cfg=Object.assign(cfg,c); }catch(e){}

const $=id=>document.getElementById(id);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const jetzt=()=>Date.now();
const aktiv=liste=>liste.filter(x=>!x.geloescht);
const sichern=()=>{ LS.setItem(DOC_KEY,JSON.stringify(doc)); LS.setItem(CFG_KEY,JSON.stringify(cfg)); };
/* Jede Änderung erhöht einen Zähler. Er entscheidet beim Abgleich, welche
   Fassung die neuere ist – anders als die Uhrzeit ist er nicht davon abhängig,
   ob die Uhren von Handy und Rechner gleich gehen. */
function stempel(r){ if(!r) return r; r.v=(r.v||0)+1; r.ts=jetzt(); return r; }

const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function setzeSchrift(s){
  cfg.schrift=['sans','times'].includes(s)?s:'serif';
  document.documentElement.setAttribute('data-schrift',cfg.schrift);
  sichern();
}

function setzeThema(t){
  cfg.thema=(t==='dunkel')?'dunkel':'hell';
  document.documentElement.setAttribute('data-thema',cfg.thema);
  const m=document.querySelector('meta[name="theme-color"]');
  if(m) m.setAttribute('content',cfg.thema==='dunkel'?'#15150F':'#F1F0EA');
  sichern();
}

/* ============ Datum ============ */
function isoVon(d){ const x=new Date(d); x.setMinutes(x.getMinutes()-x.getTimezoneOffset()); return x.toISOString().slice(0,10); }
function isoHeute(){ return isoVon(new Date()); }
function plusTage(iso,n){ const d=new Date(iso+'T12:00:00'); d.setDate(d.getDate()+n); return isoVon(d); }
function tageBis(iso){
  if(!iso) return null;
  return Math.round((new Date(iso+'T12:00:00') - new Date(isoHeute()+'T12:00:00'))/86400000);
}
const WOCHENTAGE=['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
function fmtFaellig(iso){
  const d=tageBis(iso); if(d===null) return '';
  if(d<0) return d===-1?'1 Tag überfällig':(-d)+' Tage überfällig';
  if(d===0) return 'Heute';
  if(d===1) return 'Morgen';
  if(d<7) return WOCHENTAGE[new Date(iso+'T12:00:00').getDay()];
  return new Date(iso+'T12:00:00').toLocaleDateString('de-DE',{day:'numeric',month:'short',year:tageBis(iso)>330?'numeric':undefined});
}

/* ============ Anlegen / Ändern ============ */
function aufgabeAnlegen(roh,bereichId){
  let t=String(roh||'').replace(/\s+/g,' ').trim().replace(/[.]+$/,'');
  if(t.length<2) return null;
  const text=t;
  const minPos=Math.min(0,...doc.aufgaben.filter(x=>!x.geloescht&&!x.erledigt).map(x=>x.pos??0));
  const a={ id:uid(), text:text.charAt(0).toUpperCase()+text.slice(1), notiz:'', faellig:null, zeit:null,
            wichtig:false, ton:null,
            erledigt:false, erledigtAm:null, bereichId:bereichId??cfg.ziel??null,
            vorlageId:null, pos:minPos-10, v:1, ts:jetzt(), geloescht:false };
  doc.aufgaben.unshift(a);
  geaendert();
  return a;
}
function geaendert(){ sichern(); zeichnen(); planeSync(); }
function bereichVon(id){ return doc.bereiche.find(b=>b.id===id&&!b.geloescht)||null; }
function farbeVon(id){ const b=bereichVon(id); return b?b.farbe:'#B8B8B8'; }

function abhaken(a){
  a.erledigt=!a.erledigt;
  a.erledigtAm=a.erledigt?jetzt():null;
  stempel(a);
  if(a.erledigt&&a.ton){ const d=tonDatei(a); if(d) dateiEntfernen(d,true); }
  if(a.erledigt&&a.vorlageId) serieWeiter(a.vorlageId);
  geaendert();
}
function loeschen(a){
  a.geloescht=true; stempel(a);
  if(a.ton){ const d=tonDatei(a); if(d) dateiEntfernen(d,true); }
  if(a.vorlageId&&!a.erledigt) serieWeiter(a.vorlageId);
  geaendert();
}

/* ============ Serien ============ */
function naechsterTermin(iso,r){
  let d=new Date(iso+'T12:00:00'); const n=Math.max(1,r.n||1);
  const schritt=()=>{
    if(r.typ==='tage') d.setDate(d.getDate()+n);
    else if(r.typ==='wochen') d.setDate(d.getDate()+7*n);
    else if(r.typ==='monate'){ const tag=d.getDate(); d.setDate(1); d.setMonth(d.getMonth()+n);
      d.setDate(Math.min(tag,new Date(d.getFullYear(),d.getMonth()+1,0).getDate())); }
    else d.setFullYear(d.getFullYear()+n);
  };
  schritt();
  let schutz=0;
  while(tageBis(isoVon(d))<0 && schutz++<400) schritt();
  return isoVon(d);
}
function serieWeiter(vid){
  const v=doc.vorlagen.find(x=>x.id===vid&&!x.geloescht); if(!v) return;
  v.naechster=naechsterTermin(v.naechster,v.rhythmus);
  v.aktivInstanz=null; stempel(v);
}
/* Die Kennung einer Serien-Aufgabe wird aus Vorlage und Termin gebildet, nicht zufällig.
   Damit erzeugen zwei Geräte, die dieselbe Aufgabe unabhängig anlegen, dieselbe Kennung –
   beim Abgleich werden sie zu einer einzigen zusammengeführt statt vervielfacht. */
function serienId(v){ return 's_'+v.id+'_'+v.naechster; }

function serienPutzen(){
  const gesehen=new Map(); let weg=false;
  doc.aufgaben.forEach(a=>{
    if(a.geloescht||!a.vorlageId) return;
    const s=a.vorlageId+'|'+(a.faellig||'');
    const alt=gesehen.get(s);
    if(!alt){ gesehen.set(s,a); return; }
    /* Doppelt: die abgehakte bzw. ältere Fassung behalten, die andere entfernen */
    const behalten=(alt.erledigt&&!a.erledigt)?alt:(a.erledigt&&!alt.erledigt)?a:((alt.ts||0)<=(a.ts||0)?alt:a);
    const raus=behalten===alt?a:alt;
    raus.geloescht=true; stempel(raus); weg=true;
    gesehen.set(s,behalten);
    const v=doc.vorlagen.find(x=>x.id===behalten.vorlageId);
    if(v&&v.aktivInstanz===raus.id){ v.aktivInstanz=behalten.id; stempel(v); }
  });
  return weg;
}

function serienPruefen(){
  let neu=serienPutzen();
  aktiv(doc.vorlagen).forEach(v=>{
    if(!v.naechster||!v.rhythmus) return;
    const inst=v.aktivInstanz?doc.aufgaben.find(a=>a.id===v.aktivInstanz&&!a.geloescht&&!a.erledigt):null;
    if(inst) return;
    if(tageBis(v.naechster)>(v.vorlauf??7)) return;
    const id=serienId(v);
    /* auch abgehakte Fassungen zählen – sonst entsteht sie nach dem Abhaken erneut */
    const dop=doc.aufgaben.find(a=>!a.geloescht&&(a.id===id||(a.vorlageId===v.id&&a.faellig===v.naechster)));
    if(dop){ if(!dop.erledigt&&v.aktivInstanz!==dop.id){ v.aktivInstanz=dop.id; stempel(v); neu=true; } return; }
    const a={ id, text:v.text, notiz:v.notiz||'', faellig:v.naechster, erledigt:false, erledigtAm:null,
              bereichId:v.bereichId, vorlageId:v.id,
              pos:Math.min(0,...doc.aufgaben.filter(x=>!x.geloescht&&!x.erledigt).map(x=>x.pos??0))-10,
              v:1, ts:jetzt(), geloescht:false };
    doc.aufgaben.unshift(a); v.aktivInstanz=a.id; stempel(v); neu=true;
  });
  return neu;
}
function rhythmusText(r){
  if(!r) return '';
  const n=r.n||1;
  if(r.typ==='tage')   return n===1?'täglich':`alle ${n} Tage`;
  if(r.typ==='wochen') return n===1?'wöchentlich':`alle ${n} Wochen`;
  if(r.typ==='monate') return n===1?'monatlich':(n===3?'vierteljährlich':`alle ${n} Monate`);
  return n===1?'jährlich':`alle ${n} Jahre`;
}

/* ============ Dateien (Supabase Storage) ============ */
const LEBENSDAUER=24*60*60*1000;   // 24 Stunden
const EIMER='dateien';
let ladeStand={};                   // pfad -> Prozent

function speicherBereit(){ return !!(cfg.url&&cfg.key&&cfg.code); }
function basisUrl(){ return cfg.url.replace(/\/+$/,''); }
function oeffentlicheUrl(pfad){ return basisUrl()+'/storage/v1/object/public/'+EIMER+'/'+pfad; }

function groesseText(b){
  if(b<1024) return b+' B';
  if(b<1024*1024) return (b/1024).toFixed(0)+' KB';
  return (b/1048576).toFixed(1).replace('.',',')+' MB';
}
function restText(hoch){
  const rest=LEBENSDAUER-(jetzt()-hoch);
  if(rest<=0) return 'läuft ab';
  const std=Math.floor(rest/3600000), min=Math.round((rest%3600000)/60000);
  return std>0?`noch ${std} Std.`:`noch ${min} Min.`;
}

function hochladen(datei,dauerhaft,fertig){
  if(!speicherBereit()){ melde('Erst den Abgleich einrichten (Zahnrad).',4000); return; }
  if(datei.size>50*1024*1024){ melde(`${datei.name} ist größer als 50 MB.`,5000); return; }
  const endung=(datei.name.match(/\.[a-z0-9]{1,8}$/i)||[''])[0].toLowerCase();
  const pfad=uid()+Math.random().toString(36).slice(2,10)+endung;
  const eintrag={ id:uid(), name:datei.name, groesse:datei.size, typ:datei.type||'',
                  pfad, hoch:jetzt(), v:1, ts:jetzt(), geloescht:false,
                  dauerhaft:!!dauerhaft };
  ladeStand[pfad]=0;
  if(ansicht==='dateien') zeichnen();

  const xhr=new XMLHttpRequest();
  xhr.open('POST', basisUrl()+'/storage/v1/object/'+EIMER+'/'+pfad);
  xhr.setRequestHeader('apikey',cfg.key);
  xhr.setRequestHeader('Authorization','Bearer '+cfg.key);
  xhr.setRequestHeader('Content-Type',datei.type||'application/octet-stream');
  xhr.setRequestHeader('x-upsert','false');
  xhr.upload.onprogress=e=>{
    if(!e.lengthComputable) return;
    ladeStand[pfad]=Math.round(e.loaded/e.total*100);
    const b=document.querySelector(`[data-balken="${pfad}"]`);
    if(b) b.style.width=ladeStand[pfad]+'%';
  };
  xhr.onload=()=>{
    delete ladeStand[pfad];
    if(xhr.status>=200&&xhr.status<300){
      doc.dateien.unshift(eintrag);
      if(fertig) fertig(eintrag); else { geaendert(); melde(datei.name+' übertragen.',2500); }
    }else{
      if(ansicht==='dateien') zeichnen();
      melde('Hochladen fehlgeschlagen. Ist der Speicher eingerichtet?',5000);
      if(fertig) fertig(null);
    }
  };
  xhr.onerror=()=>{ delete ladeStand[pfad]; if(ansicht==='dateien') zeichnen();
    melde('Keine Verbindung zum Speicher.',4000); if(fertig) fertig(null); };
  xhr.send(datei);
}

async function herunterladen(d){
  try{
    melde('Wird geholt …',2000);
    const r=await fetch(oeffentlicheUrl(d.pfad));
    if(!r.ok) throw new Error();
    const b=await r.blob();
    const a=document.createElement('a');
    a.href=URL.createObjectURL(b); a.download=d.name; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    melde('Gespeichert.',2000);
  }catch(e){ melde('Datei nicht mehr verfügbar.',4000); }
}

async function alleHerunterladen(){
  const ds=aktiv(doc.dateien).filter(d=>!d.dauerhaft);
  if(!ds.length) return;
  melde('Lade '+ds.length+' Dateien …',4000);
  let n=0;
  for(const d of ds){
    try{
      const r=await fetch(oeffentlicheUrl(d.pfad));
      if(!r.ok) continue;
      const b=await r.blob();
      const a=document.createElement('a');
      a.href=URL.createObjectURL(b); a.download=d.name; a.click();
      setTimeout(()=>URL.revokeObjectURL(a.href),8000);
      n++;
    }catch(e){}
    // kurze Pause, sonst verschluckt der Browser Downloads
    await new Promise(r=>setTimeout(r,700));
  }
  melde(n+' von '+ds.length+' Dateien gespeichert.',4000);
}

async function dateiEntfernen(d,still){
  try{
    await fetch(basisUrl()+'/storage/v1/object/'+EIMER+'/'+d.pfad,{
      method:'DELETE', headers:{'apikey':cfg.key,'Authorization':'Bearer '+cfg.key}
    });
  }catch(e){}
  d.geloescht=true; stempel(d);
  if(still){ sichern(); } else { geaendert(); melde('Gelöscht.',1800); }
}

function dateienAufraeumen(){
  if(!speicherBereit()) return;
  // Sprachnotizen sind an eine Aufgabe gebunden und bleiben, bis sie abgehakt wird
  const alt=aktiv(doc.dateien).filter(d=>!d.dauerhaft&&jetzt()-d.hoch>=LEBENSDAUER);
  if(!alt.length) return;
  alt.forEach(d=>dateiEntfernen(d,true));
  setTimeout(()=>{ sichern(); zeichnen(); planeSync(); },600);
}

/* ============ Sprachnotizen ============ */
let aufnahme=null, aufnahmeTeile=[], aufnahmeStart=0, aufnahmeUhr=null;

function tonDatei(a){ return a.ton?aktiv(doc.dateien).find(d=>d.id===a.ton):null; }
function dauerText(ms){
  const s=Math.round(ms/1000);
  return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
}

async function aufnahmeStarten(){
  if(!speicherBereit()) return melde('Sprachnotizen brauchen den eingerichteten Abgleich.',4500);
  if(!navigator.mediaDevices||!window.MediaRecorder) return melde('Dieser Browser kann nicht aufnehmen.',4000);
  let spur;
  try{ spur=await navigator.mediaDevices.getUserMedia({audio:true}); }
  catch(e){ return melde('Kein Zugriff auf das Mikrofon.',4000); }
  const typen=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg'];
  const typ=typen.find(t=>MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t))||'';
  aufnahme=typ?new MediaRecorder(spur,{mimeType:typ}):new MediaRecorder(spur);
  aufnahmeTeile=[]; aufnahmeStart=jetzt();
  aufnahme.ondataavailable=e=>{ if(e.data&&e.data.size) aufnahmeTeile.push(e.data); };
  aufnahme.onstop=()=>{
    spur.getTracks().forEach(t=>t.stop());
    const dauer=jetzt()-aufnahmeStart;
    const blob=new Blob(aufnahmeTeile,{type:aufnahme.mimeType||'audio/webm'});
    aufnahme=null; aufnahmeTeile=[];
    clearInterval(aufnahmeUhr); aufnahmeUhr=null;
    if(dauer<700||!blob.size){ zeichnen(); return melde('Zu kurz – nichts aufgenommen.',2500); }
    tonSpeichern(blob,dauer);
  };
  aufnahme.start();
  aufnahmeUhr=setInterval(()=>{
    const el=$('aufnahmezeit');
    if(el) el.textContent=dauerText(jetzt()-aufnahmeStart);
    if(jetzt()-aufnahmeStart>5*60000) aufnahmeBeenden();
  },500);
  zeichnen();
}
function aufnahmeBeenden(){ if(aufnahme&&aufnahme.state!=='inactive') aufnahme.stop(); }

function tonSpeichern(blob,dauer){
  const endung=(blob.type.includes('mp4')?'.m4a':blob.type.includes('ogg')?'.ogg':'.webm');
  const name='Sprachnotiz '+new Date().toLocaleString('de-DE',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})+endung;
  const datei=new File([blob],name,{type:blob.type});
  melde('Sprachnotiz wird gesichert …',4000);
  hochladen(datei,true,eintrag=>{
    if(!eintrag) return;
    const minPos=Math.min(0,...doc.aufgaben.filter(x=>!x.geloescht&&!x.erledigt).map(x=>x.pos??0));
    doc.aufgaben.unshift({ id:uid(), text:'Sprachnotiz ('+dauerText(dauer)+')', notiz:'',
      faellig:null, zeit:null, wichtig:false, ton:eintrag.id, tonDauer:dauer,
      erledigt:false, erledigtAm:null, bereichId:cfg.ziel??null, vorlageId:null,
      pos:minPos-10, v:1, ts:jetzt(), geloescht:false });
    geaendert();
    melde('Sprachnotiz angelegt.',2500);
  });
}

let spieler=null, spieltId=null;
async function tonSpielen(a){
  const d=tonDatei(a);
  if(!d) return melde('Die Aufnahme ist nicht mehr vorhanden.',3500);
  if(spieler&&spieltId===a.id){ spieler.pause(); spieler=null; spieltId=null; return zeichnen(); }
  if(spieler){ spieler.pause(); spieler=null; }
  spieler=new Audio(oeffentlicheUrl(d.pfad));
  spieltId=a.id;
  spieler.onended=()=>{ spieler=null; spieltId=null; zeichnen(); };
  spieler.onerror=()=>{ spieler=null; spieltId=null; zeichnen(); melde('Die Aufnahme ließ sich nicht abspielen.',3500); };
  try{ await spieler.play(); zeichnen(); }
  catch(e){ spieler=null; spieltId=null; melde('Abspielen nicht möglich.',3000); }
}

/* Die Kacheln werden auf Spalten verteilt und rücken dabei nach oben nach.
   Ein starres Raster würde neben einer hohen Kachel Leerraum stehen lassen. */
const KACHEL_MIN=310, KACHEL_LUECKE=18;
function kachelnStapeln(){
  const raster=document.querySelector('.raster');
  if(!raster) return;
  const kacheln=[...raster.querySelectorAll('.kachel')];
  if(!kacheln.length) return;
  const breite=raster.clientWidth;
  const anzahl=Math.max(1,Math.min(kacheln.length,
    Math.floor((breite+KACHEL_LUECKE)/(KACHEL_MIN+KACHEL_LUECKE))));
  raster.innerHTML='';
  const spalten=[];
  for(let i=0;i<anzahl;i++){
    const d=document.createElement('div'); d.className='spalte';
    raster.appendChild(d); spalten.push(d);
  }
  // Feste Zuordnung: Kachel 1 in Spalte 1, Kachel 2 in Spalte 2 und so fort.
  // Die Kacheln behalten dadurch ihren Platz; geschlossen werden nur die
  // senkrechten Lücken innerhalb einer Spalte.
  kacheln.forEach((k,i)=>spalten[i%anzahl].appendChild(k));
}

        <svg viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.6 6 .8-4.4 4.2 1.1 6.1-5.3-3-5.3 3 1.1-6.1L3.4 9.9l6-.8z"/></svg></button>`}

function bindeAufgaben(){
  document.querySelectorAll('li.auf').forEach(li=>{
    const a=doc.aufgaben.find(x=>x.id===li.dataset.id); if(!a) return;
    li.querySelector('.kasten').onclick=e=>{ e.stopPropagation(); abhaken(a); };

    if(stern) stern.onclick=e=>{ e.stopPropagation(); sternUm(a); };

    if(ton) ton.onclick=e=>{ e.stopPropagation(); tonSpielen(a); };

    if(griff){
      griff.addEventListener('pointerdown',e=>ziehenStart(e,li));
      griff.addEventListener('click',e=>e.stopPropagation());
    }
    /* die gesamte Zeile öffnet die Aufgabe – außer Kästchen und Griff,
       und nicht direkt nach dem Verschieben */
    li.onclick=e=>{
      if(e.target.closest('.kasten')||e.target.closest('.griff')||e.target.closest('.stern')||e.target.closest('.ton')) return;
      if(jetzt()-letztesZiehen<350) return;

}
let letztesZiehen=0;

/* eigene Reihenfolge: Ziehen am Griff */
function sortiert(liste){
  return liste.slice().sort((x,y)=>{
    const w=(y.wichtig?1:0)-(x.wichtig?1:0);
    return w||((x.pos??0)-(y.pos??0));
  });
}
function sternUm(a){ a.wichtig=!a.wichtig; stempel(a); geaendert(); }

function ziehenStart(e,li){
  if(e.button!==undefined&&e.button!==0) return;
  e.preventDefault();
  const ul=li.parentElement;
  li.classList.add('zieht');
  let rollUhr=null;
  const roller=document.querySelector('.wrap');
  const eigenerRoller=roller&&roller.scrollHeight>roller.clientHeight+2&&getComputedStyle(roller).overflowY!=='visible';
  const scrolle=dy=>{ if(eigenerRoller) roller.scrollTop+=dy; else window.scrollBy(0,dy); };
  const bewege=ev=>{
    ev.preventDefault();
    const y=ev.clientY;
    for(const g of [...ul.querySelectorAll('li.auf')]){
      if(g===li) continue;
      const r=g.getBoundingClientRect();
      if(y>=r.top&&y<=r.top+r.height/2){ ul.insertBefore(li,g); break; }
      if(y>r.top+r.height/2&&y<=r.bottom){ ul.insertBefore(li,g.nextSibling); break; }
    }
    clearTimeout(rollUhr);
    if(y<100) rollUhr=setTimeout(()=>scrolle(-24),16);
    else if(y>window.innerHeight-150) rollUhr=setTimeout(()=>scrolle(24),16);
  };
  const ende=()=>{
    clearTimeout(rollUhr);
    letztesZiehen=jetzt();
    document.removeEventListener('pointermove',bewege);
    document.removeEventListener('pointerup',ende);
    document.removeEventListener('pointercancel',ende);
    li.classList.remove('zieht');
    const ids=[...ul.querySelectorAll('li.auf')].map(x=>x.dataset.id);
    let geaendertWas=false;
    ids.forEach((id,i)=>{
      const a=doc.aufgaben.find(x=>x.id===id);
      if(a&&a.pos!==i*10){ a.pos=i*10; stempel(a); geaendertWas=true; }
    });
    if(geaendertWas) geaendert();
  };
  document.addEventListener('pointermove',bewege,{passive:false});
  document.addEventListener('pointerup',ende);
  document.addEventListener('pointercancel',ende);
}

function nachOben(a){
  const min=Math.min(0,...aktiv(doc.aufgaben).filter(x=>!x.erledigt).map(x=>x.pos??0));
  a.pos=min-10; stempel(a); geaendert();
}

         <div class="knopfreihe" style="margin:-6px 0 16px">
           <button class="knopf" id="d-foto">Foto aufnehmen</button>
           ${aktiv(doc.dateien).filter(d=>!d.dauerhaft).length>1?'<button class="knopf leise" id="d-alle">Alle herunterladen</button>':''}
         </div>
         ${laufend.map(p=>`<div class="ladezeile"><span>Wird übertragen …</span>
            <div class="balken"><i data-balken="${p}" style="width:${ladeStand[p]}%"></i></div></div>`).join('')}
         ${ds.length?karte('In der Ablage'+zahlAn(ds.length),'<ul class="dateiliste">'+ds.map(d=>`
           <li data-id="${d.id}">
             <div class="d-mitte">
               <div class="d-name">${esc(d.name)}</div>
               <div class="unten">${esc(groesseText(d.groesse))} &middot; ${esc(restText(d.hoch))}</div>
             </div>

             <button class="kill" data-weg="${d.id}" aria-label="Löschen">&times;</button>
           </li>`).join('')+'</ul>')
          :`<div class="leer"><b>Keine Dateien.</b>Alles, was du hier ablegst, erscheint auf dem anderen Gerät und wird nach 24 Stunden automatisch gelöscht.</div>`}
         <p class="hinweis">Dateien verschwinden 24 Stunden nach dem Hochladen von selbst – vorausgesetzt, die App wird in der Zwischenzeit einmal geöffnet. Nichts Vertrauliches ablegen: Wer die Adresse einer Datei kennt, kann sie ohne Passwort abrufen.</p>`;

      const ablage=$('ablage');
      ablage.onclick=()=>$('dateiwahl').click();
      ['dragenter','dragover'].forEach(t=>ablage.addEventListener(t,e=>{ e.preventDefault(); ablage.classList.add('drueber'); }));
      ['dragleave','drop'].forEach(t=>ablage.addEventListener(t,e=>{ e.preventDefault(); ablage.classList.remove('drueber'); }));
      ablage.addEventListener('drop',e=>{ [...(e.dataTransfer.files||[])].forEach(hochladen); });
      $('d-foto').onclick=()=>$('fotowahl').click();
      if($('d-alle')) $('d-alle').onclick=alleHerunterladen;
      c.querySelectorAll('[data-hol]').forEach(b=>b.onclick=()=>herunterladen(doc.dateien.find(x=>x.id===b.dataset.hol)));
      c.querySelectorAll('[data-weg]').forEach(b=>b.onclick=()=>dateiEntfernen(doc.dateien.find(x=>x.id===b.dataset.weg)));
    }
  }

  else if(ansicht==='start'){
    if(!amRechner()){ return setzeAnsicht('heute'); }
    const offene=aktiv(doc.aufgaben).filter(a=>!a.erledigt);
    const ueber=sortiert(offene.filter(a=>a.faellig&&tageBis(a.faellig)<0));
    const heut=sortiert(offene.filter(a=>a.faellig&&tageBis(a.faellig)===0));
    const stern=sortiert(offene.filter(a=>a.wichtig));
    const toene=sortiert(offene.filter(a=>a.ton));
    const posteingang=sortiert(offene.filter(a=>!a.faellig&&!a.ton));
    const woche=offene.filter(a=>a.faellig&&tageBis(a.faellig)>0&&tageBis(a.faellig)<=7)
                      .sort((x,y)=>x.faellig<y.faellig?-1:1);
    const dateien=aktiv(doc.dateien).filter(d=>!d.dauerhaft);
    const heuteFertig=aktiv(doc.aufgaben).filter(a=>a.erledigt&&a.erledigtAm&&isoVon(new Date(a.erledigtAm))===isoHeute());
    const notiz=(doc.notiz&&doc.notiz.text||'').trim();

    const kachel=(titel,inhalt,extra)=>`<section class="kachel${extra||''}"><h3>${titel}</h3>${inhalt}</section>`;
    const kurz=(liste,leer)=>liste.length
      ? '<ul class="knapp">'+liste.map(a=>{
          const b=bereichVon(a.bereichId);
          return `<li data-oeffne="${a.id}">
            <button class="kasten" data-hak="${a.id}" style="border-color:${esc(farbeVon(a.bereichId))}" aria-label="Abhaken"></button>
            ${a.ton?`<button class="ton${spieltId===a.id?' laeuft':''}" data-ton="${a.id}" aria-label="Abspielen"><svg viewBox="0 0 24 24">${spieltId===a.id?'<rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/>':'<path d="M7 4.5l12 7.5-12 7.5z"/>'}</svg></button>`:''}
            <span class="t">${a.wichtig?'<span class="ministern">&#9733;</span>':''}${esc(a.text)}</span>
            <span class="n">${a.faellig?esc(fmtFaellig(a.faellig))+(a.zeit?' '+esc(a.zeit):''):(b?esc(b.name):'')}</span>
          </li>`;}).join('')+'</ul>'
      : `<p class="nix">${leer}</p>`;

    c.innerHTML=`<div class="brett">
      <div class="brett-kopf">
        <div><span class="gross">${esc(new Date().toLocaleDateString('de-DE',{weekday:'long'}))}</span>
             <span class="klein">${esc(new Date().toLocaleDateString('de-DE',{day:'numeric',month:'long',year:'numeric'}))}</span></div>
        <div class="zahlen">
          ${ueber.length?`<span class="z warn"><b>${ueber.length}</b> überfällig</span>`:''}
          <span class="z"><b>${heut.length}</b> heute</span>
          <span class="z"><b>${offene.length}</b> offen</span>
          ${heuteFertig.length?`<span class="z gut"><b>${heuteFertig.length}</b> heute erledigt</span>`:''}
        </div>
      </div>
      <div class="raster">
        ${ueber.length?kachel('Überfällig',kurz(ueber,''),' dringend'):''}
        ${kachel('Heute',kurz(heut,'Heute ist nichts terminiert.'))}
        ${kachel('Wichtig',kurz(stern,'Nichts mit Stern markiert.'))}
        ${kachel('Sprachnotizen',kurz(toene,'Keine offenen Sprachnotizen.'))}
        ${kachel('Posteingang · ohne Datum',kurz(posteingang,'Alles einsortiert.'))}
        ${kachel('Nächste sieben Tage',kurz(woche,'Die Woche ist frei.'))}
        ${kachel('Dateien', dateien.length
            ? '<ul class="knapp">'+dateien.slice(0,5).map(d=>`<li><span class="t">${esc(d.name)}</span><span class="n">${esc(restText(d.hoch))}</span></li>`).join('')+'</ul>'
            : '<p class="nix">Keine Dateien in der Ablage.</p>')}
        ${kachel('Notizen', notiz
            ? '<p class="zeile" id="k-notiz">'+esc(notiz.slice(0,320))+(notiz.length>320?' …':'')+'</p>'
            : '<p class="nix">Das Notizfeld ist leer.</p>')}
      </div>
    </div>`;

    c.querySelectorAll('[data-hak]').forEach(b=>b.onclick=e=>{
      e.stopPropagation(); const a=doc.aufgaben.find(x=>x.id===b.dataset.hak); if(a) abhaken(a); });
    c.querySelectorAll('[data-ton]').forEach(b=>b.onclick=e=>{
      e.stopPropagation(); const a=doc.aufgaben.find(x=>x.id===b.dataset.ton); if(a) tonSpielen(a); });
    c.querySelectorAll('[data-oeffne]').forEach(li=>li.onclick=()=>{
      const a=doc.aufgaben.find(x=>x.id===li.dataset.oeffne); if(a) blattAufgabe(a); });
    if($('k-notiz')) $('k-notiz').onclick=()=>setzeAnsicht('notizen');
    kachelnStapeln();
  }

  else if(ansicht==='suche'){
    const q=suchbegriff.trim().toLowerCase();
    let h=`<input type="text" id="suchfeld" placeholder="Aufgaben und Notizen durchsuchen" value="${esc(suchbegriff)}" autocomplete="off">`;
    if(q.length<2){
      h+=`<div class="leer"><b>Wonach suchst du?</b>Durchsucht offene und erledigte Aufgaben, Notizen und Serien.</div>`;
    }else{
      const passt=t=>String(t||'').toLowerCase().includes(q);
      const offen=aktiv(doc.aufgaben).filter(a=>!a.erledigt&&(passt(a.text)||passt(a.notiz)));
      const fertig=aktiv(doc.aufgaben).filter(a=>a.erledigt&&(passt(a.text)||passt(a.notiz)));
      const serien=aktiv(doc.vorlagen).filter(v=>passt(v.text)||passt(v.notiz));
      const notizTreffer=passt(doc.notiz&&doc.notiz.text);
      if(offen.length) h+=karte('Offen'+zahlAn(offen.length),aufgabenHtml(sortiert(offen),true));
      if(fertig.length) h+=karte('Erledigt'+zahlAn(fertig.length),aufgabenHtml(fertig,true));
      if(serien.length) h+=karte('Serien','<ul>'+serien.map(v=>{
        const b=bereichVon(v.bereichId);
        return `<li class="serie" data-id="${v.id}"><div class="kopfz">
          <span class="punkt" style="background:${esc(b?b.farbe:'#B8B8B8')}"></span>
          <span class="nam">${esc(v.text)}</span></div>
          <div class="unten">${esc(rhythmusText(v.rhythmus))} &middot; ${esc(new Date(v.naechster+'T12:00:00').toLocaleDateString('de-DE'))}</div></li>`;
      }).join('')+'</ul>');
      if(notizTreffer){
        const t=doc.notiz.text, i=t.toLowerCase().indexOf(q);
        h+=karte('Notizen','<div class="trefferzeile" id="zur-notiz">…'+esc(t.slice(Math.max(0,i-60),i+120))+'…</div>');
      }
      if(!offen.length&&!fertig.length&&!serien.length&&!notizTreffer)
        h+=`<div class="leer"><b>Nichts gefunden.</b>Für „${esc(suchbegriff)}“ gibt es keinen Treffer.</div>`;
    }
    c.innerHTML=h;
    const feld=$('suchfeld');
    feld.oninput=()=>{ suchbegriff=feld.value; const pos=feld.selectionStart; zeichnen();
      const neu=$('suchfeld'); if(neu){ neu.focus(); try{neu.setSelectionRange(pos,pos);}catch(e){} } };
    bindeAufgaben();
    c.querySelectorAll('li.serie').forEach(li=>li.onclick=()=>blattSerie(doc.vorlagen.find(v=>v.id===li.dataset.id)));
    if($('zur-notiz')) $('zur-notiz').onclick=()=>setzeAnsicht('notizen');
  }

  else if(ansicht==='erledigt'){
    const fertig=aktiv(doc.aufgaben).filter(a=>a.erledigt).sort((x,y)=>(y.erledigtAm||0)-(x.erledigtAm||0));
    c.innerHTML=(fertig.length?karte('Erledigt'+zahlAn(fertig.length),aufgabenHtml(fertig,true)):`<div class="leer"><b>Noch nichts abgehakt.</b></div>`)
      +(fertig.length?`<div class="knopfreihe"><button class="knopf leise" id="weg">Erledigte entfernen</button></div>`:'');
    bindeAufgaben();
    if(fertig.length) $('weg').onclick=()=>{ fertig.forEach(a=>{a.geloescht=true;stempel(a);}); geaendert(); };
  }

  $('leiste').style.display=(ansicht==='heute'||ansicht==='alle'||ansicht==='bereich')?'flex':'none';
  zeichneZiel();
  zeichneAufnahme();
}

function zeichneAufnahme(){
  const k=$('tonauf'), m=$('mitschrift');
  if(!k) return;
  k.classList.toggle('nimmt',!!aufnahme);
  k.setAttribute('aria-label',aufnahme?'Aufnahme beenden':'Sprachnotiz aufnehmen');
  if(aufnahme){
    m.innerHTML='<span class="aufnahmebalken"><span class="pkt"></span>Aufnahme läuft · <span id="aufnahmezeit">0:00</span> · zum Beenden nochmal tippen</span>';
  }else if(m.querySelector('.aufnahmebalken')){ m.textContent=''; }
}

function zeichneZiel(){
  const b=ansicht==='bereich'?(offenerBereich==='__ohne'?null:bereichVon(offenerBereich)):bereichVon(cfg.ziel);
  const mehrere=aktiv(doc.bereiche).length>0;
  $('ziel').innerHTML=`<span class="punkt" style="background:${esc(b?b.farbe:'#B8B8B8')}"></span>
    Neue Aufgabe in: ${esc(b?b.name:'Ohne Bereich')}${ansicht==='bereich'?'':(mehrere?' <em>tippen zum Wechseln</em>':'')}`;
  $('ziel').style.display=ansicht==='bereich'?'none':'flex';
}
$('tonauf').onclick=()=>{ aufnahme?aufnahmeBeenden():aufnahmeStarten(); };

$('ziel').onclick=()=>{
  const bs=aktiv(doc.bereiche);
  if(!bs.length) return blattBereich(null);
  const kette=[...bs.map(b=>b.id),null];        // am Ende "Ohne Bereich"
  const i=kette.indexOf(cfg.ziel??null);
  cfg.ziel=kette[(i+1)%kette.length];
  sichern(); zeichneZiel();
};
$('ziel').oncontextmenu=e=>{ e.preventDefault(); blattZiel(); };

/* ============ Blätter ============ */
let blattOffenSeit=0, blattSperre=null;
function blattAuf(html){
  const b=$('blatt'), s=$('schleier');
  b.innerHTML=html;
  b.classList.add('auf'); s.classList.add('auf');
  /* Das Blatt fährt von unten herein und liegt danach unter dem Finger, der es
     geöffnet hat. Ohne diese kurze Sperre löst derselbe Tipp dort gleich noch
     ein Feld aus – etwa die Bereichsauswahl. */
  blattOffenSeit=jetzt();
  b.classList.add('taub');
  clearTimeout(blattSperre);
  blattSperre=setTimeout(()=>{ b.classList.remove('taub'); },450);
}
function blattZu(){
  clearTimeout(blattSperre);
  $('blatt').classList.remove('auf','taub');
  $('schleier').classList.remove('auf');
  blattOffenSeit=0;
}
$('schleier').onclick=()=>{ if(jetzt()-blattOffenSeit<450) return; blattZu(); };

/* Zweite Absicherung neben pointer-events: Ereignisse, die in den ersten
   Millisekunden im Blatt landen, stammen noch vom öffnenden Tipp. */
['pointerdown','mousedown','touchstart','click'].forEach(t=>
  $('blatt').addEventListener(t,e=>{
    if(blattOffenSeit&&jetzt()-blattOffenSeit<450){ e.stopPropagation(); e.preventDefault(); }
  },true));

function bereichOptionen(sel){
  return `<option value="">Ohne Bereich</option>`+aktiv(doc.bereiche)
    .map(b=>`<option value="${b.id}"${sel===b.id?' selected':''}>${esc(b.name)}</option>`).join('');
}

function blattAufgabe(a){
  blattAuf(`<h3>Aufgabe</h3>
    <label>Text</label><input type="text" id="f-text" value="${esc(a.text)}">
    <label>Fällig am</label><input type="date" id="f-datum" value="${a.faellig||''}">
    <div class="schnell">
      <button data-t="0">Heute</button><button data-t="1">Morgen</button>
      <button data-t="7">In einer Woche</button><button data-t="">Kein Datum</button>
    </div>
    <label>Erinnerung um</label><input type="time" id="f-zeit" value="${a.zeit||''}">
    <div class="schnell">
      <button data-z="07:00">07:00</button><button data-z="12:00">12:00</button>
      <button data-z="17:00">17:00</button><button data-z="">Keine</button>
    </div>
    <label>Bereich</label><select id="f-bereich">${bereichOptionen(a.bereichId)}</select>
    <label>Notiz</label><textarea id="f-notiz" placeholder="Telefonnummer, Adresse, Details …">${esc(a.notiz)}</textarea>
    ${a.vorlageId?`<p class="hinweis">Diese Aufgabe stammt aus einer Serie. Beim Abhaken wird automatisch der nächste Termin gesetzt.</p>`:''}
    <div class="knopfreihe">
      <button class="knopf voll" id="f-ok">Speichern</button>
      <button class="knopf" id="f-stern">${a.wichtig?'Stern entfernen':'Als wichtig markieren'}</button>
      <button class="knopf" id="f-oben">Ganz nach oben</button>
      <button class="knopf" id="f-ab">Abbrechen</button>
      <button class="knopf leise" id="f-weg">Löschen</button>
    </div>`);
  $('blatt').querySelectorAll('.schnell button[data-t]').forEach(b=>b.onclick=()=>{
    $('f-datum').value=b.dataset.t===''?'':plusTage(isoHeute(),+b.dataset.t);
  });
  $('blatt').querySelectorAll('.schnell button[data-z]').forEach(b=>b.onclick=()=>{
    $('f-zeit').value=b.dataset.z;
    if(b.dataset.z&&!$('f-datum').value) $('f-datum').value=isoHeute();
  });
  $('f-oben').onclick=()=>{ blattZu(); nachOben(a); };
  $('f-stern').onclick=()=>{ blattZu(); sternUm(a); };
  $('f-ok').onclick=()=>{
    const t=$('f-text').value.trim(); if(t.length<1) return;
    a.text=t; a.faellig=$('f-datum').value||null; a.zeit=$('f-zeit').value||null;
    if(a.zeit&&!a.faellig) a.faellig=isoHeute();
    a.bereichId=$('f-bereich').value||null; a.notiz=$('f-notiz').value;
    stempel(a); blattZu(); geaendert();
  };
  $('f-ab').onclick=blattZu;
  $('f-weg').onclick=()=>{ blattZu(); loeschen(a); };
}

function blattBereich(b){
  const neu=!b;
  const farbe=b?b.farbe:FARBEN[aktiv(doc.bereiche).length%FARBEN.length];
  blattAuf(`<h3>${neu?'Neuer Bereich':'Bereich bearbeiten'}</h3>
    <label>Name</label><input type="text" id="b-name" value="${b?esc(b.name):''}" placeholder="Arbeit, Privat, Studium …">
    <label>Farbe</label>
    <div class="farben">${FARBEN.map(f=>`<button class="farbe" data-f="${f}" style="background:${f}" aria-pressed="${f===farbe}" aria-label="Farbe"></button>`).join('')}</div>
    <div class="knopfreihe">
      <button class="knopf voll" id="b-ok">Speichern</button>
      <button class="knopf" id="b-ab">Abbrechen</button>
      ${neu?'':'<button class="knopf leise" id="b-weg">Löschen</button>'}
    </div>
    ${neu?'':'<p class="hinweis">Beim Löschen bleiben die Aufgaben erhalten und stehen danach unter „Ohne Bereich".</p>'}`);
  let gewaehlt=farbe;
  $('blatt').querySelectorAll('.farbe').forEach(k=>k.onclick=()=>{
    gewaehlt=k.dataset.f;
    $('blatt').querySelectorAll('.farbe').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.f===gewaehlt)));
  });
  $('b-ok').onclick=()=>{
    const n=$('b-name').value.trim(); if(!n) return;
    if(neu){ const nb={id:uid(),name:n,farbe:gewaehlt,v:1, ts:jetzt(), geloescht:false}; doc.bereiche.push(nb); if(!cfg.ziel) cfg.ziel=nb.id; }
    else { b.name=n; b.farbe=gewaehlt; stempel(b); }
    blattZu(); geaendert();
  };
  $('b-ab').onclick=blattZu;
  if(!neu) $('b-weg').onclick=()=>{
    b.geloescht=true; stempel(b);
    if(cfg.ziel===b.id) cfg.ziel=null;
    if(offenerBereich===b.id){ offenerBereich=null; ansicht='bereiche'; }
    blattZu(); geaendert();
  };
}

function blattSerie(v){
  const neu=!v;
  const r=v?v.rhythmus:{typ:'monate',n:1};
  blattAuf(`<h3>${neu?'Neue Serie':'Serie bearbeiten'}</h3>
    <label>Aufgabe</label><input type="text" id="s-text" value="${v?esc(v.text):''}" placeholder="z. B. Monatsabrechnung erstellen">
    <label>Bereich</label><select id="s-bereich">${bereichOptionen(v?v.bereichId:cfg.ziel)}</select>
    <label>Wiederholung</label>
    <div class="zwei">
      <input type="number" id="s-n" min="1" max="99" value="${r.n||1}">
      <select id="s-typ">
        <option value="tage"${r.typ==='tage'?' selected':''}>Tage</option>
        <option value="wochen"${r.typ==='wochen'?' selected':''}>Wochen</option>
        <option value="monate"${r.typ==='monate'?' selected':''}>Monate</option>
        <option value="jahre"${r.typ==='jahre'?' selected':''}>Jahre</option>
      </select>
    </div>
    <label>Nächster Termin</label><input type="date" id="s-datum" value="${v?v.naechster:plusTage(isoHeute(),7)}">
    <label>Erscheint in der Liste … Tage vorher</label><input type="number" id="s-vor" min="0" max="90" value="${v?(v.vorlauf??7):7}">
    <label>Notiz</label><textarea id="s-notiz">${v?esc(v.notiz||''):''}</textarea>
    <div class="knopfreihe">
      <button class="knopf voll" id="s-ok">Speichern</button>
      <button class="knopf" id="s-ab">Abbrechen</button>
      ${neu?'':'<button class="knopf" id="s-skip">Termin überspringen</button><button class="knopf leise" id="s-weg">Löschen</button>'}
    </div>`);
  $('s-ok').onclick=()=>{
    const t=$('s-text').value.trim(); if(t.length<2) return;
    const daten={ text:t, bereichId:$('s-bereich').value||null,
      rhythmus:{typ:$('s-typ').value,n:Math.max(1,parseInt($('s-n').value,10)||1)},
      naechster:$('s-datum').value||plusTage(isoHeute(),7),
      vorlauf:Math.max(0,parseInt($('s-vor').value,10)||0),
      notiz:$('s-notiz').value, geloescht:false };
    /* kein v in daten: beim Bearbeiten darf der Zaehler nicht zurueckfallen */
    if(neu) doc.vorlagen.push(stempel(Object.assign({id:uid(),aktivInstanz:null},daten)));
    else stempel(Object.assign(v,daten));
    blattZu(); geaendert();
  };
  $('s-ab').onclick=blattZu;
  if(!neu){
    $('s-skip').onclick=()=>{
      const inst=v.aktivInstanz?doc.aufgaben.find(a=>a.id===v.aktivInstanz):null;
      if(inst&&!inst.erledigt){ inst.geloescht=true; stempel(inst); }
      v.aktivInstanz=null; v.naechster=naechsterTermin(v.naechster,v.rhythmus); stempel(v);
      blattZu(); geaendert();
    };
    $('s-weg').onclick=()=>{ v.geloescht=true; stempel(v); blattZu(); geaendert(); };
  }
}

function blattZiel(){
  blattAuf(`<h3>Neue Aufgaben ablegen in</h3>
    <select id="z-b">${bereichOptionen(cfg.ziel)}</select>
    <div class="knopfreihe"><button class="knopf voll" id="z-ok">Übernehmen</button>
    <button class="knopf" id="z-ab">Abbrechen</button></div>`);
  $('z-ok').onclick=()=>{ cfg.ziel=$('z-b').value||null; blattZu(); sichern(); zeichneZiel(); };
  $('z-ab').onclick=blattZu;
}

/* ============ Eingabe ============ */
$('eingabe').addEventListener('keydown',e=>{
  if(e.key!=='Enter') return;
  const ziel=ansicht==='bereich'?(offenerBereich==='__ohne'?null:offenerBereich):cfg.ziel;
  if(aufgabeAnlegen(e.target.value,ziel)) e.target.value='';

/* ============ Diktieren ============ */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let erk=null, hoert=false, puffer='', laufend='', abschaltUhr=null;
function melde(t,ms){ const s=$('status'); s.textContent=t; clearTimeout(s._t); s._t=setTimeout(()=>{s.textContent='';},ms||3500); }
function zielBereich(){ return ansicht==='bereich'?(offenerBereich==='__ohne'?null:offenerBereich):cfg.ziel; }

/* Chrome auf Android meldet Teilergebnisse mehrfach als "endgültig" und wiederholt
   dabei den bisherigen Satz. Deshalb wird der komplette Text bei jedem Ereignis neu
   zusammengesetzt und dabei entfernt, was schon enthalten ist. */
function baueText(ergebnisse){
  let t='';
  for(let i=0;i<ergebnisse.length;i++){
    const s=(ergebnisse[i][0].transcript||'').trim();
    if(!s) continue;
    if(!t){ t=s; continue; }
    const a=t.toLowerCase(), b=s.toLowerCase();
    if(b.startsWith(a)) t=s;              // kumulativ: ersetzt den bisherigen Stand
    else if(a.endsWith(b)) continue;      // schon enthalten
    else t+=' '+s;                        // echte Fortsetzung
  }
  return t;
}

if(!SR){
  $('mik').style.opacity=.3;
  $('mik').onclick=()=>melde('Diktieren geht in diesem Browser nicht – bitte Chrome oder Edge nutzen.',5000);
}else{
  erk=new SR(); erk.lang='de-DE'; erk.continuous=true; erk.interimResults=true;
  erk.onresult=e=>{
    laufend=baueText(e.results);
    $('mitschrift').textContent=(puffer+' '+laufend).trim();
  };
  erk.onerror=e=>{
    if(e.error==='not-allowed'||e.error==='service-not-allowed'){
      hoert=false; diktatAus(true);
      melde('Mikrofon ist blockiert. Bitte in den Browser-Einstellungen für diese Seite erlauben.',6000);
    }
  };
  erk.onend=()=>{
    if(!hoert) return;
    puffer=(puffer+' '+laufend).trim(); laufend='';
    try{ erk.start(); }catch(e){}
  };
  $('mik').onclick=()=>hoert?diktatAus():diktatAn();
}

function diktatAn(){
  puffer=''; laufend='';
  try{ erk.start(); }catch(e){}
  hoert=true;
  $('mik').classList.add('an');
  $('mitschrift').textContent='';
  melde('Ich höre zu. Zum Beenden nochmal auf das Mikrofon tippen.',4000);
  clearTimeout(abschaltUhr);
  abschaltUhr=setTimeout(()=>{ if(hoert) diktatAus(); },120000);
}

function diktatAus(nurBeenden){
  hoert=false;
  clearTimeout(abschaltUhr);
  $('mik').classList.remove('an');
  try{ erk.stop(); }catch(e){}
  const text=(puffer+' '+laufend).trim();
  puffer=''; laufend='';
  $('mitschrift').textContent='';
  if(nurBeenden||!text) return;
  const a=aufgabeAnlegen(text,zielBereich());
  if(a) melde('Angelegt: '+a.text,3000);
  else melde('Da war nichts Verwertbares dabei.',2500);
}

/* ============ Abgleich ============ */
let syncTimer=null, syncLaeuft=false;
function planeSync(){ clearTimeout(syncTimer); syncTimer=setTimeout(sync,1500); }

async function rpc(fn,body){
  const basis=cfg.url.replace(/\/+$/,'');
  const r=await fetch(basis+'/rest/v1/rpc/'+fn,{
    method:'POST',
    headers:{'apikey':cfg.key,'Authorization':'Bearer '+cfg.key,'Content-Type':'application/json'},
    body:JSON.stringify(body)
  });
  if(!r.ok) throw new Error(await r.text());
  const t=await r.text();
  return t?JSON.parse(t):null;
}
/* Welche von zwei Fassungen desselben Datensatzes ist die neuere?
   Zuerst zaehlt der Aenderungszaehler, dann die Uhrzeit, zuletzt ein
   Textvergleich – damit beide Geraete bei Gleichstand dasselbe waehlen. */
function neuer(x,y){
  const vx=x.v||0, vy=y.v||0;
  if(vx!==vy) return vx>vy;
  const tx=x.ts||0, ty=y.ts||0;
  if(tx!==ty) return tx>ty;
  return fest(x)>fest(y);
}
function fest(o){ try{ return JSON.stringify(o,Object.keys(o).sort()); }catch(e){ return ''; } }

function verschmelze(a,b){
  const m=new Map();
  [...(a||[]),...(b||[])].forEach(x=>{ if(!x||!x.id) return; const v=m.get(x.id);
    if(!v||neuer(x,v)) m.set(x.id,x); });
  return [...m.values()];
}
async function sync(still){
  if(!cfg.url||!cfg.key||!cfg.code||syncLaeuft) return;
  if(!navigator.onLine){ if(!still) melde('Kein Netz – wird nachgeholt.',3000); return; }
  syncLaeuft=true;
  try{
    /* Ein einziger Aufruf: die Datenbank fuehrt zusammen und gibt das Ergebnis
       zurueck. Frueher las und schrieb die App getrennt – dazwischen konnte das
       andere Geraet schreiben, und dessen Aenderungen gingen verloren. */
    const fern=await rpc('sync_merge',{p_code:cfg.code,p_doc:doc})||{};

    /* Was waehrend des Austauschs hier getippt wurde, hat einen hoeheren
       Zaehler und setzt sich beim erneuten Zusammenfuehren durch. */
    doc.bereiche=verschmelze(doc.bereiche,fern.bereiche);
    doc.aufgaben=verschmelze(doc.aufgaben,fern.aufgaben);
    doc.vorlagen=verschmelze(doc.vorlagen,fern.vorlagen);
    doc.dateien=verschmelze(doc.dateien,fern.dateien);
    if(fern.notiz&&typeof fern.notiz==='object'&&(fern.notiz.ts||0)>((doc.notiz&&doc.notiz.ts)||0)) doc.notiz=fern.notiz;

    serienPruefen(); sichern(); zeichnen();
    swKonfigSenden();
    if(!still) melde('Abgeglichen um '+new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}),2500);
    dateienAufraeumen();
  }catch(e){
    const t=String(e&&e.message||e);
    melde(/sync_merge|404|PGRST202/.test(t)
      ? 'Abgleich noch nicht aktualisiert – bitte sync_fix.sql in Supabase ausführen.'
      : 'Abgleich fehlgeschlagen. Einstellungen prüfen.',6000);
  }finally{ syncLaeuft=false; }
}

/* ============ Erinnerungen (Web Push) ============ */
let swReg=null;

function pushMoeglich(){ return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window; }
function b64zuBytes(b64){
  const s=(b64+'==='.slice((b64.length+3)%4)).replace(/-/g,'+').replace(/_/g,'/');
  const roh=atob(s), a=new Uint8Array(roh.length);
  for(let i=0;i<roh.length;i++) a[i]=roh.charCodeAt(i);
  return a;
}
function bytesZuB64(buf){
  const a=new Uint8Array(buf); let s='';
  a.forEach(x=>s+=String.fromCharCode(x));
  return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}

async function swStarten(){
  if(!('serviceWorker' in navigator)) return null;
  try{
    swReg=await navigator.serviceWorker.register('./sw.js');
    await navigator.serviceWorker.ready;
    swKonfigSenden();

    // Auf eine neue Fassung achten und sie anbieten statt sie aufzuzwingen
    if(swReg.waiting) neueFassung(swReg.waiting);
    swReg.addEventListener('updatefound',()=>{
      const neu=swReg.installing;
      if(!neu) return;
      neu.addEventListener('statechange',()=>{
        if(neu.state==='installed'&&navigator.serviceWorker.controller) neueFassung(neu);
      });
    });
    let laedtNeu=false;
    navigator.serviceWorker.addEventListener('controllerchange',()=>{
      if(laedtNeu) return; laedtNeu=true; location.reload();
    });
    setTimeout(()=>{ try{swReg.update();}catch(e){} },3000);
    return swReg;
  }catch(e){ return null; }
}

function neueFassung(arbeiter){
  const b=$('neuband');
  if(!b||b.dataset.auf==='1') return;
  b.dataset.auf='1';
  b.innerHTML='Neue Fassung verfügbar <button id="neuband-ok">Jetzt laden</button>';
  b.classList.add('auf');
  $('neuband-ok').onclick=()=>{ b.classList.remove('auf'); arbeiter.postMessage({typ:'jetzt-aktualisieren'}); };
}

/* Verbindungszustand sichtbar machen */
function netzStand(){
  const b=$('offlineband');
  if(!b) return;
  b.classList.toggle('auf',!navigator.onLine);
}
window.addEventListener('online',()=>{ netzStand(); sync(true); });
window.addEventListener('offline',netzStand);
function swKonfigSenden(){
  if(!navigator.serviceWorker||!navigator.serviceWorker.controller) return;
  navigator.serviceWorker.controller.postMessage({typ:'cfg',cfg:{url:cfg.url,key:cfg.key,code:cfg.code}});
}

function pushMelde(t){
  const s=$('e-pushstand');
  if(s) s.textContent=t;
  melde(t,7000);
}

async function pushAnmelden(){
  if(!pushMoeglich()) return pushMelde('Dieser Browser kann keine Erinnerungen anzeigen.');
  if(!speicherBereit()) return pushMelde('Erst den Abgleich einrichten.');
  if(!cfg.vapid) return pushMelde('Es fehlt der öffentliche Schlüssel unter Zugangsdaten.');
  if(location.protocol!=='https:'&&location.hostname!=='localhost')
    return pushMelde('Erinnerungen brauchen eine https-Adresse.');

  pushMelde('Wird eingerichtet …');
  let erlaubnis;
  try{ erlaubnis=await Notification.requestPermission(); }
  catch(e){ return pushMelde('Die Nachfrage nach der Erlaubnis schlug fehl: '+(e&&e.message||e)); }
  if(erlaubnis!=='granted')
    return pushMelde('Benachrichtigungen wurden abgelehnt. In den Chrome-Einstellungen für diese Seite erlauben.');

  let reg;
  try{
    reg=await navigator.serviceWorker.register('./sw.js');
    await navigator.serviceWorker.ready;
    swReg=reg;
  }catch(e){
    return pushMelde('Der Hintergrunddienst (sw.js) ließ sich nicht laden: '+(e&&e.message||e));
  }

  let ab;
  try{
    ab=await reg.pushManager.getSubscription();
    if(ab){
      const alt=bytesZuB64(ab.options.applicationServerKey||new ArrayBuffer(0));
      if(alt!==cfg.vapid){ await ab.unsubscribe(); ab=null; }
    }
    if(!ab) ab=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64zuBytes(cfg.vapid)});
  }catch(e){
    return pushMelde('Anmeldung beim Push-Dienst fehlgeschlagen – meist stimmt der öffentliche Schlüssel nicht: '+(e&&e.message||e));
  }

  try{
    const j=ab.toJSON();
    await rpc('push_anmelden',{p_code:cfg.code,p_endpoint:j.endpoint,
      p_p256dh:j.keys?j.keys.p256dh:'',p_auth:j.keys?j.keys.auth:'',
      p_geraet:(navigator.userAgent.match(/Android|iPhone|iPad|Macintosh|Windows/)||['Gerät'])[0]});
  }catch(e){
    return pushMelde('Das Gerät ließ sich nicht in der Datenbank vermerken. Wurde push_setup.sql ausgeführt? '+(e&&e.message||e));
  }

  cfg.push=true; sichern(); swKonfigSenden();
  melde('Erinnerungen sind auf diesem Gerät aktiv.',4000);
  blattZu();
}

async function pushAbmelden(){
  try{
    const reg=swReg||await navigator.serviceWorker.getRegistration();
    const ab=reg&&await reg.pushManager.getSubscription();
    if(ab){ await rpc('push_abmelden',{p_code:cfg.code,p_endpoint:ab.endpoint}).catch(()=>{}); await ab.unsubscribe(); }
  }catch(e){}
  cfg.push=false; sichern(); blattZu();
  melde('Erinnerungen auf diesem Gerät abgeschaltet.',3500);
}

  blattAuf(`<h3>Einstellungen</h3>
    <label>Erscheinungsbild</label>
    <div class="wahl">
      <button data-t="hell" aria-pressed="${cfg.thema!=='dunkel'}">Hell</button>
      <button data-t="dunkel" aria-pressed="${cfg.thema==='dunkel'}">Dunkel</button>
    </div>
    <label>Schrift</label>
    <div class="wahl">
      <button data-s="serif" aria-pressed="${cfg.schrift!=='times'&&cfg.schrift!=='sans'}" style="font-family:'Iowan Old Style',Georgia,serif">Serif</button>
      <button data-s="times" aria-pressed="${cfg.schrift==='times'}" style="font-family:'Times New Roman',Times,serif">Times</button>
      <button data-s="sans"  aria-pressed="${cfg.schrift==='sans'}"  style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">Serifenlos</button>
    </div>
    <label>Sicherungskopie</label>
    <div class="schnell"><button id="e-exp">Als Datei sichern</button><button id="e-imp">Datei laden</button></div>
    <label>Erinnerungen auf diesem Gerät</label>
    <p class="hinweis" style="margin:0 0 10px" id="e-pushstand">…</p>
    <div class="knopfreihe" style="margin-top:0" id="e-pushreihe"></div>
    <label>Abgleich</label>
    <p class="hinweis" style="margin:0 0 10px">${verbunden?'Eingerichtet und aktiv.':'Noch nicht eingerichtet.'}</p>
    <div class="knopfreihe" style="margin-top:0">
      ${verbunden?'<button class="knopf" id="e-jetzt">Jetzt abgleichen</button>':''}
      <button class="knopf leise" id="e-zeig">Zugangsdaten …</button>
    </div>
    <div class="knopfreihe"><button class="knopf voll" id="e-ab">Schließen</button></div>`);

  $('blatt').querySelectorAll('.wahl button[data-t]').forEach(b=>b.onclick=()=>{
    setzeThema(b.dataset.t);
    $('blatt').querySelectorAll('.wahl button[data-t]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.t===cfg.thema)));
  });
  $('blatt').querySelectorAll('.wahl button[data-s]').forEach(b=>b.onclick=()=>{
    setzeSchrift(b.dataset.s);
    $('blatt').querySelectorAll('.wahl button[data-s]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.s===cfg.schrift)));
  });
  $('e-exp').onclick=()=>{
    const b=new Blob([JSON.stringify(doc,null,2)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(b);
    a.download='todo-'+isoHeute()+'.json'; a.click(); URL.revokeObjectURL(a.href);
  };
  $('e-imp').onclick=()=>$('datei').click();

  (async()=>{
    const stand=$('e-pushstand'), reihe=$('e-pushreihe');
    if(!stand) return;
    if(!pushMoeglich()){ stand.textContent='Dieser Browser unterstützt keine Erinnerungen. Am Rechner Chrome oder Edge verwenden.'; return; }
    if(!verbunden){ stand.textContent='Erst den Abgleich einrichten.'; return; }
    if(!cfg.vapid){ stand.textContent='Es fehlt der öffentliche Schlüssel – unter Zugangsdaten eintragen.'; return; }
    if(Notification.permission==='denied'){
      stand.textContent='Benachrichtigungen sind für diese Seite blockiert. Bitte in den Browser-Einstellungen erlauben.'; return; }
    const reg=await navigator.serviceWorker.getRegistration();
    const ab=reg&&await reg.pushManager.getSubscription();
    if(ab&&Notification.permission==='granted'){
      stand.textContent='Aktiv. Aufgaben mit Uhrzeit melden sich von selbst.';
      reihe.innerHTML='<button class="knopf leise" id="e-pushaus">Abschalten</button>';
      $('e-pushaus').onclick=pushAbmelden;
    }else{
      stand.textContent='Noch nicht aktiv. Erinnerungen kommen nur für Aufgaben mit Uhrzeit.';
      reihe.innerHTML='<button class="knopf" id="e-pushan">Auf diesem Gerät aktivieren</button>';
      $('e-pushan').onclick=pushAnmelden;
    }
  })();
  if(verbunden) $('e-jetzt').onclick=()=>{ blattZu(); sync(); };
  $('e-zeig').onclick=blattZugang;
  $('e-ab').onclick=blattZu;
};

function blattZugang(){
  blattAuf(`<h3>Zugangsdaten</h3>
    <p class="hinweis" style="margin:0 0 14px">Diese Angaben verbinden Handy und Rechner.
    Bitte nur ändern, wenn du weißt, was du tust – ohne sie ist kein Abgleich möglich.</p>
    <div class="knopfreihe" style="margin-top:0"><button class="knopf" id="z-frei">Zum Bearbeiten freigeben</button>
    <button class="knopf voll" id="z-zurueck">Zurück</button></div>
    <div id="z-feld" hidden>
      <label>Supabase Projekt-URL</label>
      <input type="text" id="e-url" value="${esc(cfg.url)}" placeholder="https://xxxx.supabase.co" autocapitalize="off" spellcheck="false" disabled>
      <label>anon key</label>
      <input type="text" id="e-key" value="${esc(cfg.key)}" placeholder="eyJhbGci…" autocapitalize="off" spellcheck="false" disabled>
      <label>Sync-Code (auf allen Geräten identisch)</label>
      <input type="text" id="e-code" value="${esc(cfg.code)}" placeholder="mindestens 12 Zeichen" autocapitalize="off" spellcheck="false" disabled>
      <div class="schnell"><button id="e-gen">Code erzeugen</button><button id="e-kopie">Code kopieren</button></div>
      <label>Öffentlicher Schlüssel für Erinnerungen</label>
      <input type="text" id="e-vapid" value="${esc(cfg.vapid||'')}" placeholder="B… (aus vapid.html)" autocapitalize="off" spellcheck="false" disabled>
      <div class="knopfreihe">
        <button class="knopf voll" id="e-ok">Speichern &amp; abgleichen</button>
        <button class="knopf" id="e-verwerf">Verwerfen</button>
      </div>
      <p class="hinweis">Der Sync-Code ist das Passwort für deine Liste. Wer ihn kennt, sieht die Aufgaben.
      Notiere ihn dir an einem sicheren Ort.</p>
    </div>`);

  $('z-zurueck').onclick=()=>$('btn-einst').click();
  $('z-frei').onclick=()=>{
    $('z-feld').hidden=false;
    ['e-url','e-key','e-code','e-vapid'].forEach(i=>$(i).disabled=false);
    $('z-frei').remove();
  };
  $('e-gen').onclick=()=>{
    const z='abcdefghijkmnpqrstuvwxyz23456789'; let s='';
    const a=new Uint8Array(20); crypto.getRandomValues(a);
    a.forEach(x=>s+=z[x%z.length]);
    $('e-code').value=s;
  };
  $('e-kopie').onclick=async()=>{
    try{ await navigator.clipboard.writeText($('e-code').value); melde('Code kopiert.',2000); }
    catch(e){ $('e-code').select(); }
  };
  $('e-verwerf').onclick=()=>$('btn-einst').click();
  $('e-ok').onclick=()=>{
    const u=$('e-url').value.trim(), k=$('e-key').value.trim(), co=$('e-code').value.trim();
    if(co&&co.length<12) return melde('Der Sync-Code muss mindestens 12 Zeichen haben.',4000);
    cfg.url=u; cfg.key=k; cfg.code=co; cfg.vapid=$('e-vapid').value.trim();
    sichern(); blattZu();
    if(cfg.url&&cfg.key&&cfg.code) sync(); else melde('Gespeichert. Abgleich ist noch nicht eingerichtet.',3000);
  };
}
$('datei').onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const n=JSON.parse(r.result);
      doc.bereiche=verschmelze(doc.bereiche,n.bereiche);
      doc.aufgaben=verschmelze(doc.aufgaben,n.aufgaben);
      doc.vorlagen=verschmelze(doc.vorlagen,n.vorlagen);
      if(n.notiz&&typeof n.notiz==='object'&&(n.notiz.ts||0)>((doc.notiz&&doc.notiz.ts)||0)) doc.notiz=n.notiz;
      blattZu(); geaendert(); melde('Daten übernommen.',2500);
    }catch(err){ melde('Diese Datei passt nicht.',3000); }
  };
  r.readAsText(f); e.target.value='';
};

/* ============ Teilen-Ziel / Start ============ */
(function start(){
  setzeThema(cfg.thema);
  setzeSchrift(cfg.schrift);
  doc.aufgaben.forEach((a,i)=>{ if(typeof a.pos!=='number') a.pos=i*10; });
  const p=new URLSearchParams(location.search);
  const geteilt=[p.get('title'),p.get('text'),p.get('url')].filter(Boolean).join(' ').trim();
  if(geteilt){ aufgabeAnlegen(geteilt,cfg.ziel); history.replaceState({},'',location.pathname); }
  ansicht=cfg.ansicht||'heute';
  if(ansicht==='bereich') ansicht='bereiche';
  $('logo').onclick=()=>{ offenerBereich=null; setzeAnsicht('heute'); };
  zeichnen();
  netzStand();
  sync(true);
  swStarten();
})();

document.addEventListener('visibilitychange',()=>{ if(!document.hidden){ zeichnen(); sync(true); } });
setInterval(()=>{ if(!document.hidden) sync(true); },45000);
