<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>To do</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#FFFFFF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="To do">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" href="./icon-192.png">
<style>
  :root{
    --tinte:#111111;
    --papier:#FFFFFF;
    --grau:#767676;
    --linie:#DEDEDE;
    --feld:#F7F7F7;
    --auswahl:#EFEFEF;
    --warn:#B03A2E;
    --schleier:rgba(0,0,0,.35);
    --schatten:rgba(0,0,0,.12);
  }
  html[data-thema="dunkel"]{
    --tinte:#E9E9E5;
    --papier:#131313;
    --grau:#8C8C86;
    --linie:#2E2E2C;
    --feld:#1D1D1B;
    --auswahl:#262624;
    --warn:#E88075;
    --schleier:rgba(0,0,0,.6);
    --schatten:rgba(0,0,0,.5);
    color-scheme:dark;
  }
  /* Bereichsfarben sind für weißen Grund gewählt; dunkel brauchen sie mehr Leuchtkraft */
  html[data-thema="dunkel"] .punkt,
  html[data-thema="dunkel"] .kasten,
  html[data-thema="dunkel"] .farbe{filter:brightness(1.45) saturate(1.05)}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--papier)}
  body{
    font-family:"Times New Roman",Times,Liberation Serif,serif;
    color:var(--tinte);font-size:18px;line-height:1.4;
    min-height:100vh;
    padding:18px 18px calc(150px + env(safe-area-inset-bottom));
    display:flex;justify-content:center;
  }
  .rahmen{width:100%;max-width:640px}
  aside{display:none}
  .wrap{width:100%;max-width:640px}
  button,input,select,textarea{font-family:inherit;color:inherit}

  /* Kopf */
  .kopf{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px}
  .logo{display:inline-block;text-align:center;cursor:pointer}
  .logo span{font-size:34px;line-height:1;letter-spacing:.01em;display:block}
  .logo i{display:block;height:1.5px;background:var(--tinte);margin:5px auto 0;width:72%}
  .zahn{background:none;border:0;padding:6px;cursor:pointer;font-size:22px;line-height:1;color:var(--grau)}

  /* Reiter */
  nav{display:flex;gap:20px;border-bottom:1px solid var(--linie);margin-bottom:16px;overflow-x:auto;scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  nav button{
    background:none;border:0;padding:0 0 9px;cursor:pointer;white-space:nowrap;
    font-size:16px;color:var(--grau);position:relative;
  }
  nav button[aria-current="true"]{color:var(--tinte)}
  nav button[aria-current="true"]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--tinte)}

  h2{font-size:15px;font-weight:normal;font-variant:small-caps;letter-spacing:.08em;color:var(--grau);
     margin:22px 0 2px;border-bottom:1px solid var(--linie);padding-bottom:5px}
  h2:first-child{margin-top:0}

  /* Aufgaben */
  ul{list-style:none;margin:0;padding:0}
  li.auf{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid var(--linie);cursor:pointer}
  .kasten{
    flex:0 0 auto;width:20px;height:20px;margin-top:3px;border:1.5px solid var(--grau);
    background:var(--papier);cursor:pointer;padding:0;position:relative;border-radius:3px;
  }
  .kasten::after{
    content:"";position:absolute;left:5px;top:2px;width:6px;height:11px;
    border:solid var(--papier);border-width:0 2px 2px 0;transform:rotate(42deg) scale(0);
    transition:transform .16s ease;
  }
  li.fertig .kasten::after{transform:rotate(42deg) scale(1)}
  .mitte{flex:1;min-width:0}
  .kasten::before{content:"";position:absolute;left:-10px;right:-8px;top:-10px;bottom:-10px}
  .titel{word-break:break-word}
  li.fertig .titel{color:var(--grau);text-decoration:line-through}
  .unten{font-size:14px;color:var(--grau);margin-top:1px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .bereichs-tag{display:inline-flex;align-items:center;gap:5px}
  .punkt{width:9px;height:9px;border-radius:50%;flex:0 0 auto;display:inline-block}
  .faellig.warn{color:var(--warn)}
  .faellig.heute{color:var(--tinte)}
  .notizzeichen{font-style:italic}
  .griff{
    flex:0 0 auto;background:none;border:0;padding:6px 2px 6px 8px;cursor:grab;
    touch-action:none;opacity:.45;align-self:center;
  }
  .griff:active{cursor:grabbing;opacity:1}
  .griff svg{width:15px;height:18px;display:block}
  li.auf.zieht{opacity:.55;background:var(--feld);outline:1px dashed var(--grau);outline-offset:-1px}

  /* Bereiche */
  li.bereich{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--linie);cursor:pointer}
  li.bereich .punkt{width:14px;height:14px}
  li.bereich .nam{flex:1;font-size:20px}
  li.bereich .anz{color:var(--grau);font-size:15px}
  .stift{background:none;border:0;color:var(--grau);cursor:pointer;font-size:15px;padding:4px}

  /* Serien */
  li.serie{padding:13px 0;border-bottom:1px solid var(--linie);cursor:pointer}
  li.serie .kopfz{display:flex;gap:10px;align-items:center}
  li.serie .kopfz .nam{flex:1}

  .leer{padding:36px 2px;color:var(--grau)}
  #notizfeld{
    width:100%;min-height:calc(100vh - 300px);font-size:17px;line-height:1.5;
    background:var(--papier);border:1px solid var(--linie);border-radius:5px;padding:14px;
    outline:none;resize:vertical;
  }
  #notizfeld:focus{border-color:var(--tinte)}

  /* Dateien */
  .ablage{
    border:1.5px dashed var(--linie);border-radius:8px;padding:26px 18px;text-align:center;
    cursor:pointer;margin-bottom:18px;transition:border-color .15s,background .15s;
  }
  .ablage:hover,.ablage.drueber{border-color:var(--tinte);background:var(--feld)}
  .ablage b{display:block;font-weight:normal;font-size:20px;margin-bottom:3px}
  .ablage span{font-size:14px;color:var(--grau)}
  .ladezeile{padding:10px 2px;border-bottom:1px solid var(--linie);font-size:14px;color:var(--grau)}
  .balken{height:4px;background:var(--feld);border-radius:2px;margin-top:6px;overflow:hidden}
  .balken i{display:block;height:100%;background:var(--tinte);width:0;transition:width .2s}
  ul.dateiliste li{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--linie)}
  .d-mitte{flex:1;min-width:0}
  .d-name{word-break:break-all}
  .d-hol{background:none;border:1px solid var(--linie);border-radius:4px;padding:6px 13px;
         font-size:15px;cursor:pointer;color:var(--tinte);flex:0 0 auto}
  .d-hol:hover{border-color:var(--tinte)}
  .leer b{display:block;color:var(--tinte);font-weight:normal;font-size:21px;margin-bottom:4px}
  .zurueck{background:none;border:0;color:var(--grau);cursor:pointer;padding:0 0 10px;font-size:16px}
  .titelzeile{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .titelzeile h1{font-size:26px;font-weight:normal;margin:0;flex:1}

  .knopf{
    background:var(--papier);border:1px solid var(--tinte);border-radius:4px;padding:9px 16px;
    font-size:16px;cursor:pointer;
  }
  .knopf.voll{background:var(--tinte);color:var(--papier)}
  .knopf.leise{border-color:var(--linie);color:var(--grau)}
  .knopfreihe{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}

  /* Eingabeleiste */
  .leiste{
    position:fixed;left:0;right:0;bottom:0;background:var(--papier);border-top:1px solid var(--linie);
    padding:10px 18px calc(12px + env(safe-area-inset-bottom));display:flex;justify-content:center;
  }
  .leiste-inner{width:100%;max-width:640px}
  .ziel{display:flex;align-items:center;gap:7px;font-size:14px;color:var(--grau);
        background:none;border:0;padding:0 0 7px;cursor:pointer}
  .ziel em{font-style:normal;font-size:12.5px;opacity:.6;margin-left:2px}
  .reihe{display:flex;gap:10px;align-items:center}
  input[type=text],input[type=date],input[type=number],select,textarea{
    width:100%;font-size:16px;background:var(--feld);border:1px solid var(--linie);
    border-radius:4px;padding:11px 12px;outline:none;
  }
  input:focus,select:focus,textarea:focus{border-color:var(--tinte)}
  textarea{resize:vertical;min-height:80px;line-height:1.4}
  .mik{
    flex:0 0 auto;width:50px;height:50px;border-radius:50%;background:var(--tinte);border:0;
    cursor:pointer;position:relative;display:grid;place-items:center;color:var(--papier);
  }
  .mik.an{color:#fff}
  .mik svg{width:22px;height:22px;position:relative;z-index:1}
  .mik .welle{position:absolute;inset:0;border-radius:50%;background:var(--warn);opacity:0}
  .mik.an{background:var(--warn)}
  .mik.an .welle{animation:welle 1.5s ease-out infinite}
  @keyframes welle{0%{transform:scale(1);opacity:.5}100%{transform:scale(1.7);opacity:0}}
  .mitschrift{font-style:italic;color:var(--grau);min-height:0;font-size:15px;padding:0 0 6px}

  /* Blatt (Dialog) */
  .schleier{position:fixed;inset:0;background:var(--schleier);display:none;z-index:20}
  .schleier.auf{display:block}
  .blatt{
    position:fixed;left:0;right:0;bottom:0;background:var(--papier);z-index:21;
    border-radius:12px 12px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));
    max-height:88vh;overflow-y:auto;transform:translateY(100%);
    visibility:hidden;transition:transform .22s ease,visibility .22s ease;
    box-shadow:0 -4px 24px var(--schatten);
  }
  .blatt.auf{transform:none;visibility:visible}
  .blatt.taub{pointer-events:none}
  @media(min-width:680px){
    .blatt{left:50%;right:auto;bottom:auto;top:50%;width:560px;max-width:92vw;
           transform:translate(-50%,-42%) scale(.97);opacity:0;border-radius:10px;
           visibility:hidden;transition:transform .18s ease,opacity .18s ease,visibility .18s ease}
    .blatt.auf{transform:translate(-50%,-50%);opacity:1;visibility:visible}
  }
  .blatt h3{font-size:22px;font-weight:normal;margin:0 0 16px}
  label{display:block;font-size:14px;color:var(--grau);margin:14px 0 5px}
  label:first-of-type{margin-top:0}
  .farben{display:flex;gap:10px;flex-wrap:wrap}
  .farbe{width:34px;height:34px;border-radius:50%;border:2px solid var(--papier);cursor:pointer;
         box-shadow:0 0 0 1px var(--linie)}
  .farbe[aria-pressed="true"]{box-shadow:0 0 0 2px var(--tinte)}
  .wahl{display:flex;gap:8px}
  .wahl button{
    flex:1;background:var(--papier);border:1px solid var(--linie);border-radius:5px;
    padding:10px;font-size:16px;cursor:pointer;color:var(--grau);
  }
  .wahl button[aria-pressed="true"]{border-color:var(--tinte);color:var(--tinte);background:var(--feld)}
  input:disabled{color:var(--grau);opacity:.75;cursor:not-allowed}
  .schnell{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .schnell button{background:var(--feld);border:1px solid var(--linie);border-radius:20px;
                  padding:6px 13px;font-size:14px;cursor:pointer;color:var(--grau)}
  .zwei{display:flex;gap:10px}
  .zwei>*{flex:1}
  .hinweis{font-size:14px;color:var(--grau);margin:10px 0 0;line-height:1.35}
  .status{position:fixed;left:0;right:0;bottom:calc(96px + env(safe-area-inset-bottom));
          text-align:center;font-size:14px;color:var(--grau);pointer-events:none;z-index:30;
          padding:0 18px}
  :focus-visible{outline:2px solid var(--tinte);outline-offset:2px}

  /* ===== Desktop: Seitenleiste statt Reiter ===== */
  @media(min-width:900px){
    body{padding:0;height:100vh;overflow:hidden;align-items:stretch}
    .rahmen{max-width:1180px;height:100vh;display:flex}
    .haupt{flex:1;min-width:0;display:flex;flex-direction:column;height:100vh}
    .wrap{flex:1;min-height:0;overflow-y:auto;padding:30px 34px 40px;max-width:none}
    .kopf,nav{display:none}
    aside{
      display:flex;flex-direction:column;flex:0 0 246px;width:246px;height:100vh;
      border-right:1px solid var(--linie);padding:30px 20px 20px;overflow-y:auto;
    }
    .s-logo{text-align:center;margin-bottom:26px;cursor:pointer}
    .s-logo span{font-size:30px;line-height:1;display:block}
    .s-logo i{display:block;height:1.5px;background:var(--tinte);margin:5px auto 0;width:64%}
    .s-nav{display:flex;flex-direction:column;gap:1px}
    .s-nav button{
      display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;
      border:0;padding:8px 10px;border-radius:5px;cursor:pointer;font-size:17px;color:var(--tinte);
    }
    .s-nav button:hover{background:var(--feld)}
    .s-nav button[aria-current="true"]{background:var(--auswahl)}
    .s-nav button .nam{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .s-nav button em{font-style:normal;font-size:14px;color:var(--grau)}
    .s-titel{
      display:flex;align-items:center;justify-content:space-between;margin:24px 0 6px;padding:0 10px;
      font-size:14px;font-variant:small-caps;letter-spacing:.08em;color:var(--grau);
    }
    .s-titel button{background:none;border:0;cursor:pointer;color:var(--grau);font-size:19px;line-height:1;padding:0 4px}
    .s-fuss{margin-top:auto;padding-top:18px;border-top:1px solid var(--linie)}
    .s-fuss button{background:none;border:0;cursor:pointer;color:var(--grau);font-size:15px;padding:6px 10px;text-align:left;width:100%;border-radius:5px}
    .s-fuss button:hover{background:var(--feld);color:var(--tinte)}
    .leiste{position:static;padding:14px 34px 20px;flex:0 0 auto}
    .leiste-inner{max-width:none}
    .status{bottom:auto;top:16px;right:24px;left:auto;text-align:right}
    #notizfeld{min-height:calc(100vh - 190px)}
    h2:first-child{margin-top:0}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="rahmen">
<aside id="seite"></aside>
<div class="haupt">
<div class="wrap">
  <div class="kopf">
    <div class="logo" id="logo" role="button" tabindex="0" title="Zur Startansicht">
      <span>To do</span><i></i>
    </div>
    <button class="zahn" id="btn-einst" aria-label="Einstellungen">&#9881;</button>
  </div>

  <nav id="nav"></nav>
  <div id="inhalt"></div>
</div>

<div class="leiste" id="leiste">
  <div class="leiste-inner">
    <div class="mitschrift" id="mitschrift"></div>
    <button class="ziel" id="ziel"></button>
    <div class="reihe">
      <input type="text" id="eingabe" placeholder="Aufgabe eintippen und Enter" autocomplete="off">
      <button class="mik" id="mik" aria-label="Diktieren">
        <span class="welle"></span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <rect x="9" y="2" width="6" height="11" rx="3" fill="currentColor" stroke="none"/>
          <path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v4"/>
        </svg>
      </button>
    </div>
  </div>
</div>
</div>
</div>

<div class="status" id="status"></div>
<div class="schleier" id="schleier"></div>
<div class="blatt" id="blatt"></div>
<input type="file" id="datei" accept="application/json" hidden>
<input type="file" id="dateiwahl" multiple hidden>

<script>
"use strict";

/* ============ Speicher ============ */
const LS = (() => {
  try { localStorage.setItem('_p','1'); localStorage.removeItem('_p'); return localStorage; }
  catch(e){ const m={}; return {getItem:k=>k in m?m[k]:null,setItem:(k,v)=>{m[k]=String(v)}}; }
})();
const DOC_KEY='todo.doc.v1', CFG_KEY='todo.cfg.v1';

const FARBEN=['#B03A2E','#CA6F1E','#B7950B','#1E8449','#0E8074','#1F6FB2','#34495E','#6C3483','#A5468B','#5D6D7E'];

let doc={bereiche:[],aufgaben:[],vorlagen:[],notiz:{text:'',ts:0},dateien:[]};
let cfg={url:'',key:'',code:'',ziel:null,ansicht:'heute',thema:'hell',vapid:'',push:false};
let ansicht='heute', offenerBereich=null, notizUhr=null;

try{ const d=JSON.parse(LS.getItem(DOC_KEY)); if(d&&typeof d==='object') doc={bereiche:d.bereiche||[],aufgaben:d.aufgaben||[],vorlagen:d.vorlagen||[],notiz:(d.notiz&&typeof d.notiz==='object')?d.notiz:{text:'',ts:0},dateien:d.dateien||[]}; }catch(e){}
try{ const c=JSON.parse(LS.getItem(CFG_KEY)); if(c&&typeof c==='object') cfg=Object.assign(cfg,c); }catch(e){}

const $=id=>document.getElementById(id);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const jetzt=()=>Date.now();
const aktiv=liste=>liste.filter(x=>!x.geloescht);
const sichern=()=>{ LS.setItem(DOC_KEY,JSON.stringify(doc)); LS.setItem(CFG_KEY,JSON.stringify(cfg)); };
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function setzeThema(t){
  cfg.thema=(t==='dunkel')?'dunkel':'hell';
  document.documentElement.setAttribute('data-thema',cfg.thema);
  const m=document.querySelector('meta[name="theme-color"]');
  if(m) m.setAttribute('content',cfg.thema==='dunkel'?'#131313':'#FFFFFF');
  sichern();
}

/* ============ Datum ============ */
function isoVon(d){ const x=new Date(d); x.setMinutes(x.getMinutes()-x.getTimezoneOffset()); return x.toISOString().slice(0,10); }
function isoHeute(){ return isoVon(new Date()); }
function plusTage(iso,n){ const d=new Date(iso+'T12:00:00'); d.setDate(d.getDate()+n); return isoVon(d); }
function tageBis(iso){
  if(!iso) return null;
  return Math.round((new Date(iso+'T12:00:00') - new Date(isoHeute()+'T12:00:00'))/86400000);
}
const WOCHENTAGE=['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
function fmtFaellig(iso){
  const d=tageBis(iso); if(d===null) return '';
  if(d<0) return d===-1?'1 Tag überfällig':(-d)+' Tage überfällig';
  if(d===0) return 'Heute';
  if(d===1) return 'Morgen';
  if(d<7) return WOCHENTAGE[new Date(iso+'T12:00:00').getDay()];
  return new Date(iso+'T12:00:00').toLocaleDateString('de-DE',{day:'numeric',month:'short',year:tageBis(iso)>330?'numeric':undefined});
}

/* ============ Datumserkennung im Text ============ */
const ZAHLWORT={ein:1,einer:1,einem:1,eins:1,zwei:2,drei:3,vier:4,fünf:5,fuenf:5,sechs:6,sieben:7,acht:8,neun:9,zehn:10,elf:11,zwölf:12,zwoelf:12,vierzehn:14};
function zahl(s){ if(!s) return null; s=s.toLowerCase(); return /^\d+$/.test(s)?parseInt(s,10):(ZAHLWORT[s]??null); }

function erkenneDatum(roh){
  let text=' '+roh+' ', faellig=null, zeit=null;
  const weg=re=>{ const m=text.match(re); if(m){ text=text.replace(m[0],' '); return m; } return null; };
  const zahlM='(\\d{1,2}|ein|einer|einem|zwei|drei|vier|fünf|fuenf|sechs|sieben|acht|neun|zehn|elf|zwölf|zwoelf|vierzehn)';
  let m;

  /* Uhrzeit zuerst, damit "um 8" nicht mit "am 8." verwechselt wird */
  const STUNDE={ein:1,eins:1,zwei:2,drei:3,vier:4,fünf:5,fuenf:5,sechs:6,sieben:7,acht:8,neun:9,zehn:10,elf:11,zwölf:12,zwoelf:12};
  const stundeM='(\\d{1,2}|ein|eins|zwei|drei|vier|fünf|fuenf|sechs|sieben|acht|neun|zehn|elf|zwölf|zwoelf)';
  const spaet=/abends|nachmittags|nachmittag|abend/i.test(text);
  let h=null,min=0;
  if((m=weg(/\sum\s+(\d{1,2})[:.](\d{2})\s*(uhr)?\s/i))){ h=+m[1]; min=+m[2]; }
  else if((m=weg(new RegExp('\\s(um\\s+)?halb\\s+'+stundeM+'\\s','i')))){
    const z=/^\d+$/.test(m[2])?+m[2]:STUNDE[m[2].toLowerCase()];
    if(z){ h=(z===1?12:z-1); min=30; }
  }
  else if((m=weg(new RegExp('\\sum\\s+'+stundeM+'\\s+uhr\\s+drei(ss|ß)ig\\s','i')))){ h=/^\d+$/.test(m[1])?+m[1]:STUNDE[m[1].toLowerCase()]; min=30; }
  else if((m=weg(new RegExp('\\sum\\s+'+stundeM+'\\s*uhr\\s','i')))){ h=/^\d+$/.test(m[1])?+m[1]:STUNDE[m[1].toLowerCase()]; }
  else if((m=weg(/\sum\s+(\d{1,2})\s/i))){ h=+m[1]; }
  if(h!==null&&h>=0&&h<=23){
    if(spaet&&h<12) h+=12;
    weg(/\s(abends|nachmittags|nachmittag|abend|morgens|vormittags|früh)\s/i);
    zeit=String(h).padStart(2,'0')+':'+String(min).padStart(2,'0');
  }

  if((m=weg(/\s(am\s+)?(\d{1,2})\.(\d{1,2})\.(\d{4}|\d{2})?\s/i))){
    const t=+m[2], mo=+m[3]; let j=m[4]?(m[4].length===2?2000+ +m[4]:+m[4]):new Date().getFullYear();
    let iso=`${j}-${String(mo).padStart(2,'0')}-${String(t).padStart(2,'0')}`;
    if(!m[4] && tageBis(iso)<0) iso=`${j+1}-${String(mo).padStart(2,'0')}-${String(t).padStart(2,'0')}`;
    faellig=iso;
  }
  else if((m=weg(/\s(am\s+)(\d{1,2})\.(?!\d)\s/i))){
    const t=+m[2], n=new Date(); let mo=n.getMonth(), j=n.getFullYear();
    let iso=`${j}-${String(mo+1).padStart(2,'0')}-${String(t).padStart(2,'0')}`;
    if(tageBis(iso)<0){ mo++; if(mo>11){mo=0;j++;} iso=`${j}-${String(mo+1).padStart(2,'0')}-${String(t).padStart(2,'0')}`; }
    faellig=iso;
  }
  else if(weg(/\sübermorgen\s/i)) faellig=plusTage(isoHeute(),2);
  else if(weg(/\s(heute\s+abend|heute)\s/i)) faellig=isoHeute();
  else if(weg(/\s(morgen\s+früh|morgen\s+abend|morgen)\s/i)) faellig=plusTage(isoHeute(),1);
  else if((m=weg(new RegExp('\\sin\\s+'+zahlM+'\\s+wochen?\\s','i')))) { const n=zahl(m[1]); if(n) faellig=plusTage(isoHeute(),7*n); }
  else if((m=weg(new RegExp('\\sin\\s+'+zahlM+'\\s+tagen?\\s','i')))) { const n=zahl(m[1]); if(n) faellig=plusTage(isoHeute(),n); }
  else if(weg(/\s(nächste|naechste|kommende)\s+woche\s/i)) faellig=plusTage(isoHeute(),7);
  else if((m=weg(/\s(am\s+|nächsten\s+|naechsten\s+|kommenden\s+)?(montag|dienstag|mittwoch|donnerstag|freitag|samstag|sonnabend|sonntag)\s/i))){
    const namen={montag:1,dienstag:2,mittwoch:3,donnerstag:4,freitag:5,samstag:6,sonnabend:6,sonntag:0};
    const ziel=namen[m[2].toLowerCase()], heute=new Date().getDay();
    let diff=(ziel-heute+7)%7; if(diff===0) diff=7;
    faellig=plusTage(isoHeute(),diff);
  }

  text=text.replace(/\s+/g,' ').trim().replace(/^(und|dann|bis|am|noch|um)\s+/i,'').replace(/[,;]+$/,'').trim();
  if(zeit&&!faellig) faellig=isoHeute();
  return {text,faellig,zeit};
}

/* ============ Anlegen / Ändern ============ */
function aufgabeAnlegen(roh,bereichId){
  let t=String(roh||'').replace(/\s+/g,' ').trim().replace(/[.]+$/,'');
  if(t.length<2) return null;
  const {text,faellig,zeit}=erkenneDatum(t);
  if(text.length<2) return null;
  const minPos=Math.min(0,...doc.aufgaben.filter(x=>!x.geloescht&&!x.erledigt).map(x=>x.pos??0));
  const a={ id:uid(), text:text.charAt(0).toUpperCase()+text.slice(1), notiz:'', faellig, zeit:zeit||null,
            erledigt:false, erledigtAm:null, bereichId:bereichId??cfg.ziel??null,
            vorlageId:null, pos:minPos-10, ts:jetzt(), geloescht:false };
  doc.aufgaben.unshift(a);
  geaendert();
  return a;
}
function geaendert(){ sichern(); zeichnen(); planeSync(); }
function bereichVon(id){ return doc.bereiche.find(b=>b.id===id&&!b.geloescht)||null; }
function farbeVon(id){ const b=bereichVon(id); return b?b.farbe:'#B8B8B8'; }

function abhaken(a){
  a.erledigt=!a.erledigt;
  a.erledigtAm=a.erledigt?jetzt():null;
  a.ts=jetzt();
  if(a.erledigt&&a.vorlageId) serieWeiter(a.vorlageId);
  geaendert();
}
function loeschen(a){
  a.geloescht=true; a.ts=jetzt();
  if(a.vorlageId&&!a.erledigt) serieWeiter(a.vorlageId);
  geaendert();
}

/* ============ Serien ============ */
function naechsterTermin(iso,r){
  let d=new Date(iso+'T12:00:00'); const n=Math.max(1,r.n||1);
  const schritt=()=>{
    if(r.typ==='tage') d.setDate(d.getDate()+n);
    else if(r.typ==='wochen') d.setDate(d.getDate()+7*n);
    else if(r.typ==='monate'){ const tag=d.getDate(); d.setDate(1); d.setMonth(d.getMonth()+n);
      d.setDate(Math.min(tag,new Date(d.getFullYear(),d.getMonth()+1,0).getDate())); }
    else d.setFullYear(d.getFullYear()+n);
  };
  schritt();
  let schutz=0;
  while(tageBis(isoVon(d))<0 && schutz++<400) schritt();
  return isoVon(d);
}
function serieWeiter(vid){
  const v=doc.vorlagen.find(x=>x.id===vid&&!x.geloescht); if(!v) return;
  v.naechster=naechsterTermin(v.naechster,v.rhythmus);
  v.aktivInstanz=null; v.ts=jetzt();
}
/* Die Kennung einer Serien-Aufgabe wird aus Vorlage und Termin gebildet, nicht zufällig.
   Damit erzeugen zwei Geräte, die dieselbe Aufgabe unabhängig anlegen, dieselbe Kennung –
   beim Abgleich werden sie zu einer einzigen zusammengeführt statt vervielfacht. */
function serienId(v){ return 's_'+v.id+'_'+v.naechster; }

function serienPutzen(){
  const gesehen=new Map(); let weg=false;
  doc.aufgaben.forEach(a=>{
    if(a.geloescht||!a.vorlageId) return;
    const s=a.vorlageId+'|'+(a.faellig||'');
    const alt=gesehen.get(s);
    if(!alt){ gesehen.set(s,a); return; }
    /* Doppelt: die abgehakte bzw. ältere Fassung behalten, die andere entfernen */
    const behalten=(alt.erledigt&&!a.erledigt)?alt:(a.erledigt&&!alt.erledigt)?a:((alt.ts||0)<=(a.ts||0)?alt:a);
    const raus=behalten===alt?a:alt;
    raus.geloescht=true; raus.ts=jetzt(); weg=true;
    gesehen.set(s,behalten);
    const v=doc.vorlagen.find(x=>x.id===behalten.vorlageId);
    if(v&&v.aktivInstanz===raus.id){ v.aktivInstanz=behalten.id; v.ts=jetzt(); }
  });
  return weg;
}

function serienPruefen(){
  let neu=serienPutzen();
  aktiv(doc.vorlagen).forEach(v=>{
    if(!v.naechster||!v.rhythmus) return;
    const inst=v.aktivInstanz?doc.aufgaben.find(a=>a.id===v.aktivInstanz&&!a.geloescht&&!a.erledigt):null;
    if(inst) return;
    if(tageBis(v.naechster)>(v.vorlauf??7)) return;
    const id=serienId(v);
    /* auch abgehakte Fassungen zählen – sonst entsteht sie nach dem Abhaken erneut */
    const dop=doc.aufgaben.find(a=>!a.geloescht&&(a.id===id||(a.vorlageId===v.id&&a.faellig===v.naechster)));
    if(dop){ if(!dop.erledigt&&v.aktivInstanz!==dop.id){ v.aktivInstanz=dop.id; v.ts=jetzt(); neu=true; } return; }
    const a={ id, text:v.text, notiz:v.notiz||'', faellig:v.naechster, erledigt:false, erledigtAm:null,
              bereichId:v.bereichId, vorlageId:v.id,
              pos:Math.min(0,...doc.aufgaben.filter(x=>!x.geloescht&&!x.erledigt).map(x=>x.pos??0))-10,
              ts:jetzt(), geloescht:false };
    doc.aufgaben.unshift(a); v.aktivInstanz=a.id; v.ts=jetzt(); neu=true;
  });
  return neu;
}
function rhythmusText(r){
  if(!r) return '';
  const n=r.n||1;
  if(r.typ==='tage')   return n===1?'täglich':`alle ${n} Tage`;
  if(r.typ==='wochen') return n===1?'wöchentlich':`alle ${n} Wochen`;
  if(r.typ==='monate') return n===1?'monatlich':(n===3?'vierteljährlich':`alle ${n} Monate`);
  return n===1?'jährlich':`alle ${n} Jahre`;
}

/* ============ Dateien (Supabase Storage) ============ */
const LEBENSDAUER=24*60*60*1000;   // 24 Stunden
const EIMER='dateien';
let ladeStand={};                   // pfad -> Prozent

function speicherBereit(){ return !!(cfg.url&&cfg.key&&cfg.code); }
function basisUrl(){ return cfg.url.replace(/\/+$/,''); }
function oeffentlicheUrl(pfad){ return basisUrl()+'/storage/v1/object/public/'+EIMER+'/'+pfad; }

function groesseText(b){
  if(b<1024) return b+' B';
  if(b<1024*1024) return (b/1024).toFixed(0)+' KB';
  return (b/1048576).toFixed(1).replace('.',',')+' MB';
}
function restText(hoch){
  const rest=LEBENSDAUER-(jetzt()-hoch);
  if(rest<=0) return 'läuft ab';
  const std=Math.floor(rest/3600000), min=Math.round((rest%3600000)/60000);
  return std>0?`noch ${std} Std.`:`noch ${min} Min.`;
}

function hochladen(datei){
  if(!speicherBereit()) return melde('Erst den Abgleich einrichten (Zahnrad).',4000);
  if(datei.size>50*1024*1024) return melde(`${datei.name} ist größer als 50 MB.`,5000);
  const endung=(datei.name.match(/\.[a-z0-9]{1,8}$/i)||[''])[0].toLowerCase();
  const pfad=uid()+Math.random().toString(36).slice(2,10)+endung;
  const eintrag={ id:uid(), name:datei.name, groesse:datei.size, typ:datei.type||'',
                  pfad, hoch:jetzt(), ts:jetzt(), geloescht:false };
  ladeStand[pfad]=0;
  if(ansicht==='dateien') zeichnen();

  const xhr=new XMLHttpRequest();
  xhr.open('POST', basisUrl()+'/storage/v1/object/'+EIMER+'/'+pfad);
  xhr.setRequestHeader('apikey',cfg.key);
  xhr.setRequestHeader('Authorization','Bearer '+cfg.key);
  xhr.setRequestHeader('Content-Type',datei.type||'application/octet-stream');
  xhr.setRequestHeader('x-upsert','false');
  xhr.upload.onprogress=e=>{
    if(!e.lengthComputable) return;
    ladeStand[pfad]=Math.round(e.loaded/e.total*100);
    const b=document.querySelector(`[data-balken="${pfad}"]`);
    if(b) b.style.width=ladeStand[pfad]+'%';
  };
  xhr.onload=()=>{
    delete ladeStand[pfad];
    if(xhr.status>=200&&xhr.status<300){
      doc.dateien.unshift(eintrag); geaendert();
      melde(datei.name+' übertragen.',2500);
    }else{
      if(ansicht==='dateien') zeichnen();
      melde('Hochladen fehlgeschlagen. Ist der Speicher eingerichtet?',5000);
    }
  };
  xhr.onerror=()=>{ delete ladeStand[pfad]; if(ansicht==='dateien') zeichnen(); melde('Keine Verbindung zum Speicher.',4000); };
  xhr.send(datei);
}

async function herunterladen(d){
  try{
    melde('Wird geholt …',2000);
    const r=await fetch(oeffentlicheUrl(d.pfad));
    if(!r.ok) throw new Error();
    const b=await r.blob();
    const a=document.createElement('a');
    a.href=URL.createObjectURL(b); a.download=d.name; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    melde('Gespeichert.',2000);
  }catch(e){ melde('Datei nicht mehr verfügbar.',4000); }
}

async function dateiEntfernen(d,still){
  try{
    await fetch(basisUrl()+'/storage/v1/object/'+EIMER+'/'+d.pfad,{
      method:'DELETE', headers:{'apikey':cfg.key,'Authorization':'Bearer '+cfg.key}
    });
  }catch(e){}
  d.geloescht=true; d.ts=jetzt();
  if(still){ sichern(); } else { geaendert(); melde('Gelöscht.',1800); }
}

function dateienAufraeumen(){
  if(!speicherBereit()) return;
  const alt=aktiv(doc.dateien).filter(d=>jetzt()-d.hoch>=LEBENSDAUER);
  if(!alt.length) return;
  alt.forEach(d=>dateiEntfernen(d,true));
  setTimeout(()=>{ sichern(); zeichnen(); planeSync(); },600);
}

function aufgabenHtml(liste,zeigeBereich){
  return '<ul>'+liste.map(a=>{
    const f=farbeVon(a.bereichId), b=bereichVon(a.bereichId), t=tageBis(a.faellig);
    const kl=t===null?'':(t<0?'faellig warn':(t===0?'faellig heute':'faellig'));
    const teile=[];
    if(a.faellig) teile.push(`<span class="${kl}">${esc(fmtFaellig(a.faellig))}${a.zeit?' '+esc(a.zeit):''}</span>`);
    if(a.zeit&&!a.erledigt) teile.push('<span title="Erinnerung">&#9200;</span>');
    if(zeigeBereich&&b) teile.push(`<span class="bereichs-tag"><span class="punkt" style="background:${esc(b.farbe)}"></span>${esc(b.name)}</span>`);
    if(a.vorlageId) teile.push('<span>Serie</span>');
    if(a.notiz&&a.notiz.trim()) teile.push('<span class="notizzeichen">Notiz</span>');
    return `<li class="auf${a.erledigt?' fertig':''}" data-id="${a.id}">
      <button class="kasten" style="${a.erledigt?`background:${esc(f)};border-color:${esc(f)}`:`border-color:${esc(f)}`}" aria-label="Abhaken"></button>
      <div class="mitte"><div class="titel">${esc(a.text)}</div>${teile.length?`<div class="unten">${teile.join('')}</div>`:''}</div>
      ${a.erledigt?'':`<button class="griff" aria-label="Verschieben" title="Zum Verschieben ziehen">
        <svg viewBox="0 0 10 16" fill="currentColor"><circle cx="2" cy="3" r="1.4"/><circle cx="8" cy="3" r="1.4"/><circle cx="2" cy="8" r="1.4"/><circle cx="8" cy="8" r="1.4"/><circle cx="2" cy="13" r="1.4"/><circle cx="8" cy="13" r="1.4"/></svg></button>`}
    </li>`;
  }).join('')+'</ul>';
}
function bindeAufgaben(){
  document.querySelectorAll('li.auf').forEach(li=>{
    const a=doc.aufgaben.find(x=>x.id===li.dataset.id); if(!a) return;
    li.querySelector('.kasten').onclick=e=>{ e.stopPropagation(); abhaken(a); };
    const griff=li.querySelector('.griff');
    if(griff){
      griff.addEventListener('pointerdown',e=>ziehenStart(e,li));
      griff.addEventListener('click',e=>e.stopPropagation());
    }
    /* die gesamte Zeile öffnet die Aufgabe – außer Kästchen und Griff,
       und nicht direkt nach dem Verschieben */
    li.onclick=e=>{
      if(e.target.closest('.kasten')||e.target.closest('.griff')) return;
      if(jetzt()-letztesZiehen<350) return;
      blattAufgabe(a);
    };
  });
}
let letztesZiehen=0;

/* eigene Reihenfolge: Ziehen am Griff */
function sortiert(liste){ return liste.slice().sort((x,y)=>(x.pos??0)-(y.pos??0)); }

function ziehenStart(e,li){
  if(e.button!==undefined&&e.button!==0) return;
  e.preventDefault();
  const ul=li.parentElement;
  li.classList.add('zieht');
  let rollUhr=null;
  const roller=document.querySelector('.wrap');
  const eigenerRoller=roller&&roller.scrollHeight>roller.clientHeight+2&&getComputedStyle(roller).overflowY!=='visible';
  const scrolle=dy=>{ if(eigenerRoller) roller.scrollTop+=dy; else window.scrollBy(0,dy); };
  const bewege=ev=>{
    ev.preventDefault();
    const y=ev.clientY;
    for(const g of [...ul.querySelectorAll('li.auf')]){
      if(g===li) continue;
      const r=g.getBoundingClientRect();
      if(y>=r.top&&y<=r.top+r.height/2){ ul.insertBefore(li,g); break; }
      if(y>r.top+r.height/2&&y<=r.bottom){ ul.insertBefore(li,g.nextSibling); break; }
    }
    clearTimeout(rollUhr);
    if(y<100) rollUhr=setTimeout(()=>scrolle(-24),16);
    else if(y>window.innerHeight-150) rollUhr=setTimeout(()=>scrolle(24),16);
  };
  const ende=()=>{
    clearTimeout(rollUhr);
    letztesZiehen=jetzt();
    document.removeEventListener('pointermove',bewege);
    document.removeEventListener('pointerup',ende);
    document.removeEventListener('pointercancel',ende);
    li.classList.remove('zieht');
    const ids=[...ul.querySelectorAll('li.auf')].map(x=>x.dataset.id);
    let geaendertWas=false;
    ids.forEach((id,i)=>{
      const a=doc.aufgaben.find(x=>x.id===id);
      if(a&&a.pos!==i*10){ a.pos=i*10; a.ts=jetzt(); geaendertWas=true; }
    });
    if(geaendertWas) geaendert();
  };
  document.addEventListener('pointermove',bewege,{passive:false});
  document.addEventListener('pointerup',ende);
  document.addEventListener('pointercancel',ende);
}

function nachOben(a){
  const min=Math.min(0,...aktiv(doc.aufgaben).filter(x=>!x.erledigt).map(x=>x.pos??0));
  a.pos=min-10; a.ts=jetzt(); geaendert();
}

function zeichnen(){
  if(serienPruefen()) sichern();
  zeichneNav();
  zeichneSeite();
  const c=$('inhalt');
  const offene=aktiv(doc.aufgaben).filter(a=>!a.erledigt);

  if(ansicht==='heute'){
    const faellig=offene.filter(a=>a.faellig&&tageBis(a.faellig)<=0);
    const ohne=sortiert(offene.filter(a=>!a.faellig));
    let h='';
    const ueber=sortiert(faellig.filter(a=>tageBis(a.faellig)<0)), heut=sortiert(faellig.filter(a=>tageBis(a.faellig)===0));
    if(ueber.length) h+='<h2>Überfällig</h2>'+aufgabenHtml(ueber,true);
    if(heut.length) h+='<h2>Heute</h2>'+aufgabenHtml(heut,true);
    if(ohne.length) h+='<h2>Ohne Datum</h2>'+aufgabenHtml(ohne,true);
    c.innerHTML=h||`<div class="leer"><b>Nichts zu tun.</b>Keine Aufgabe ist heute fällig.</div>`;
    bindeAufgaben();
  }

  else if(ansicht==='alle'){
    const mit=offene.filter(a=>a.faellig);
    const ohne=sortiert(offene.filter(a=>!a.faellig));
    const grp={ueber:[],heute:[],woche:[],spaeter:[]};
    mit.forEach(a=>{ const t=tageBis(a.faellig);
      if(t<0) grp.ueber.push(a); else if(t===0) grp.heute.push(a); else if(t<=7) grp.woche.push(a); else grp.spaeter.push(a); });
    Object.keys(grp).forEach(k=>grp[k]=sortiert(grp[k]));
    let h='';
    if(ohne.length) h+='<h2>Ohne Datum</h2>'+aufgabenHtml(ohne,true);
    if(grp.ueber.length) h+='<h2>Überfällig</h2>'+aufgabenHtml(grp.ueber,true);
    if(grp.heute.length) h+='<h2>Heute</h2>'+aufgabenHtml(grp.heute,true);
    if(grp.woche.length) h+='<h2>Diese Woche</h2>'+aufgabenHtml(grp.woche,true);
    if(grp.spaeter.length) h+='<h2>Später</h2>'+aufgabenHtml(grp.spaeter,true);
    c.innerHTML=h||`<div class="leer"><b>Liste ist leer.</b>Unten eintippen oder das Mikrofon drücken.</div>`;
    bindeAufgaben();
  }

  else if(ansicht==='bereiche'){
    const bs=aktiv(doc.bereiche);
    let h='';
    if(bs.length){
      h+='<ul>'+bs.map(b=>{
        const n=offene.filter(a=>a.bereichId===b.id).length;
        return `<li class="bereich" data-id="${b.id}">
          <span class="punkt" style="background:${esc(b.farbe)}"></span>
          <span class="nam">${esc(b.name)}</span>
          <span class="anz">${n}</span>
          <button class="stift" data-edit="${b.id}" aria-label="Bearbeiten">bearbeiten</button>

    }
    const ohneN=offene.filter(a=>!bereichVon(a.bereichId)).length;
    if(ohneN) h+=`<ul><li class="bereich" data-id="__ohne">
        <span class="punkt" style="background:#B8B8B8"></span>
        <span class="nam">Ohne Bereich</span><span class="anz">${ohneN}</span></li></ul>`;
    if(!h) h=`<div class="leer"><b>Noch keine Bereiche.</b>Zum Beispiel Arbeit, Privat, Studium.</div>`;
    h+=`<div class="knopfreihe"><button class="knopf voll" id="neu-bereich">Bereich anlegen</button></div>`;
    c.innerHTML=h;
    c.querySelectorAll('li.bereich').forEach(li=>li.onclick=e=>{
      if(e.target.dataset.edit){ blattBereich(bereichVon(e.target.dataset.edit)); return; }
      offenerBereich=li.dataset.id; setzeAnsicht('bereich');
    });
    $('neu-bereich').onclick=()=>blattBereich(null);
  }

  else if(ansicht==='bereich'){
    const b=offenerBereich==='__ohne'?null:bereichVon(offenerBereich);
    if(offenerBereich!=='__ohne'&&!b){ offenerBereich=null; return setzeAnsicht('bereiche'); }
    const liste=sortiert(offene.filter(a=>offenerBereich==='__ohne'?!bereichVon(a.bereichId):a.bereichId===offenerBereich));
    c.innerHTML=`<button class="zurueck" id="zur">&larr; Bereiche</button>
      <div class="titelzeile">
        <span class="punkt" style="width:14px;height:14px;background:${esc(b?b.farbe:'#B8B8B8')}"></span>
        <h1>${esc(b?b.name:'Ohne Bereich')}</h1>
        ${b?'<button class="stift" id="b-edit">bearbeiten</button>':''}
      </div>`+
      (liste.length?aufgabenHtml(liste,false):`<div class="leer"><b>Nichts offen.</b>In diesem Bereich ist alles erledigt.</div>`);
    $('zur').onclick=()=>{ offenerBereich=null; setzeAnsicht('bereiche'); };
    if(b) $('b-edit').onclick=()=>blattBereich(b);
    bindeAufgaben();
  }

  else if(ansicht==='serien'){
    const vs=aktiv(doc.vorlagen).sort((x,y)=>(x.naechster||'')<(y.naechster||'')?-1:1);
    let h=vs.length?'<ul>'+vs.map(v=>{
      const b=bereichVon(v.bereichId);
      return `<li class="serie" data-id="${v.id}">
        <div class="kopfz"><span class="punkt" style="background:${esc(b?b.farbe:'#B8B8B8')}"></span>
        <span class="nam">${esc(v.text)}</span></div>
        <div class="unten">${esc(rhythmusText(v.rhythmus))} &middot; nächster Termin ${esc(new Date(v.naechster+'T12:00:00').toLocaleDateString('de-DE'))} &middot; erscheint ${v.vorlauf??7} Tage vorher</div>
      </li>`;}).join('')+'</ul>'
      :`<div class="leer"><b>Keine Serien.</b>Wiederkehrendes wird hier gepflegt und taucht erst kurz vor dem Termin in der Liste auf.</div>`;
    h+=`<div class="knopfreihe"><button class="knopf voll" id="neu-serie">Serie anlegen</button></div>`;
    c.innerHTML=h;
    c.querySelectorAll('li.serie').forEach(li=>li.onclick=()=>blattSerie(doc.vorlagen.find(v=>v.id===li.dataset.id)));
    $('neu-serie').onclick=()=>blattSerie(null);
  }

  else if(ansicht==='notizen'){
    const feld=$('notizfeld');
    if(feld&&document.activeElement===feld){ zeichneZiel(); return; }
    c.innerHTML=`<textarea id="notizfeld" placeholder="Hier ist Platz für alles, was keine Aufgabe ist – Telefonnummern, Ideen, Einkaufszettel, Gedanken.&#10;&#10;Der Text bleibt stehen, bis du ihn selbst löschst."></textarea>
      <p class="hinweis" id="notizstand">Wird automatisch gespeichert.</p>`;
    const t=$('notizfeld');
    t.value=(doc.notiz&&doc.notiz.text)||'';
    t.addEventListener('input',()=>{
      clearTimeout(notizUhr);
      $('notizstand').textContent='Wird gespeichert …';
      notizUhr=setTimeout(()=>{
        doc.notiz={text:t.value,ts:jetzt()};
        sichern(); planeSync();
        $('notizstand').textContent='Gespeichert um '+new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
      },700);
    });
    t.addEventListener('blur',()=>{
      clearTimeout(notizUhr);
      if(t.value!==((doc.notiz&&doc.notiz.text)||'')){ doc.notiz={text:t.value,ts:jetzt()}; sichern(); planeSync(); }
    });
  }

  else if(ansicht==='dateien'){
    if(!speicherBereit()){
      c.innerHTML=`<div class="leer"><b>Noch nicht eingerichtet.</b>

    }else{
      const ds=aktiv(doc.dateien).sort((x,y)=>y.hoch-x.hoch);

      c.innerHTML=
        `<div class="ablage" id="ablage">

           <span>oder hierher ziehen &middot; höchstens 50 MB</span>
         </div>
         ${laufend.map(p=>`<div class="ladezeile"><span>Wird übertragen …</span>
            <div class="balken"><i data-balken="${p}" style="width:${ladeStand[p]}%"></i></div></div>`).join('')}

           <li data-id="${d.id}">

               <div class="d-name">${esc(d.name)}</div>

         <p class="hinweis">Dateien verschwinden 24 Stunden nach dem Hochladen von selbst – vorausgesetzt, die App wird in der Zwischenzeit einmal geöffnet. Nichts Vertrauliches ablegen: Wer die Adresse einer Datei kennt, kann sie ohne Passwort abrufen.</p>`;

      const ablage=$('ablage');
      ablage.onclick=()=>$('dateiwahl').click();
      ['dragenter','dragover'].forEach(t=>ablage.addEventListener(t,e=>{ e.preventDefault(); ablage.classList.add('drueber'); }));
      ['dragleave','drop'].forEach(t=>ablage.addEventListener(t,e=>{ e.preventDefault(); ablage.classList.remove('drueber'); }));
      ablage.addEventListener('drop',e=>{ [...(e.dataTransfer.files||[])].forEach(hochladen); });
      c.querySelectorAll('[data-hol]').forEach(b=>b.onclick=()=>herunterladen(doc.dateien.find(x=>x.id===b.dataset.hol)));
      c.querySelectorAll('[data-weg]').forEach(b=>b.onclick=()=>dateiEntfernen(doc.dateien.find(x=>x.id===b.dataset.weg)));
    }

  else if(ansicht==='erledigt'){
    const fertig=aktiv(doc.aufgaben).filter(a=>a.erledigt).sort((x,y)=>(y.erledigtAm||0)-(x.erledigtAm||0));
    c.innerHTML=(fertig.length?aufgabenHtml(fertig,true):`<div class="leer"><b>Noch nichts abgehakt.</b></div>`)
      +(fertig.length?`<div class="knopfreihe"><button class="knopf leise" id="weg">Erledigte entfernen</button></div>`:'');
    bindeAufgaben();
    if(fertig.length) $('weg').onclick=()=>{ fertig.forEach(a=>{a.geloescht=true;a.ts=jetzt();}); geaendert(); };

}

/* ============ Blätter ============ */
let blattOffenSeit=0, blattSperre=null;
function blattAuf(html){
  const b=$('blatt'), s=$('schleier');
  b.innerHTML=html;
  b.classList.add('auf'); s.classList.add('auf');
  /* Das Blatt fährt von unten herein und liegt danach unter dem Finger, der es
     geöffnet hat. Ohne diese kurze Sperre löst derselbe Tipp dort gleich noch
     ein Feld aus – etwa die Bereichsauswahl. */
  blattOffenSeit=jetzt();
  b.classList.add('taub');
  clearTimeout(blattSperre);
  blattSperre=setTimeout(()=>{ b.classList.remove('taub'); },450);
}
function blattZu(){
  clearTimeout(blattSperre);
  $('blatt').classList.remove('auf','taub');
  $('schleier').classList.remove('auf');
  blattOffenSeit=0;
}
$('schleier').onclick=()=>{ if(jetzt()-blattOffenSeit<450) return; blattZu(); };

/* Zweite Absicherung neben pointer-events: Ereignisse, die in den ersten
   Millisekunden im Blatt landen, stammen noch vom öffnenden Tipp. */
['pointerdown','mousedown','touchstart','click'].forEach(t=>
  $('blatt').addEventListener(t,e=>{
    if(blattOffenSeit&&jetzt()-blattOffenSeit<450){ e.stopPropagation(); e.preventDefault(); }
  },true));

function bereichOptionen(sel){

}

/* ============ Diktieren ============ */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let erk=null, hoert=false, puffer='', laufend='', abschaltUhr=null;
function melde(t,ms){ const s=$('status'); s.textContent=t; clearTimeout(s._t); s._t=setTimeout(()=>{s.textContent='';},ms||3500); }
function zielBereich(){ return ansicht==='bereich'?(offenerBereich==='__ohne'?null:offenerBereich):cfg.ziel; }

/* Chrome auf Android meldet Teilergebnisse mehrfach als "endgültig" und wiederholt
   dabei den bisherigen Satz. Deshalb wird der komplette Text bei jedem Ereignis neu
   zusammengesetzt und dabei entfernt, was schon enthalten ist. */
function baueText(ergebnisse){
  let t='';
  for(let i=0;i<ergebnisse.length;i++){
    const s=(ergebnisse[i][0].transcript||'').trim();
    if(!s) continue;
    if(!t){ t=s; continue; }
    const a=t.toLowerCase(), b=s.toLowerCase();
    if(b.startsWith(a)) t=s;              // kumulativ: ersetzt den bisherigen Stand
    else if(a.endsWith(b)) continue;      // schon enthalten
    else t+=' '+s;                        // echte Fortsetzung
  }
  return t;
}

if(!SR){
  $('mik').style.opacity=.3;
  $('mik').onclick=()=>melde('Diktieren geht in diesem Browser nicht – bitte Chrome oder Edge nutzen.',5000);
}else{
  erk=new SR(); erk.lang='de-DE'; erk.continuous=true; erk.interimResults=true;
  erk.onresult=e=>{
    laufend=baueText(e.results);
    $('mitschrift').textContent=(puffer+' '+laufend).trim();
  };
  erk.onerror=e=>{
    if(e.error==='not-allowed'||e.error==='service-not-allowed'){
      hoert=false; diktatAus(true);
      melde('Mikrofon ist blockiert. Bitte in den Browser-Einstellungen für diese Seite erlauben.',6000);
    }
  };
  erk.onend=()=>{
    if(!hoert) return;
    puffer=(puffer+' '+laufend).trim(); laufend='';
    try{ erk.start(); }catch(e){}
  };
  $('mik').onclick=()=>hoert?diktatAus():diktatAn();
}

function diktatAn(){
  puffer=''; laufend='';
  try{ erk.start(); }catch(e){}
  hoert=true;
  $('mik').classList.add('an');
  $('mitschrift').textContent='';
  melde('Ich höre zu. Zum Beenden nochmal auf das Mikrofon tippen.',4000);
  clearTimeout(abschaltUhr);
  abschaltUhr=setTimeout(()=>{ if(hoert) diktatAus(); },120000);
}

function diktatAus(nurBeenden){
  hoert=false;
  clearTimeout(abschaltUhr);
  $('mik').classList.remove('an');
  try{ erk.stop(); }catch(e){}
  const text=(puffer+' '+laufend).trim();
  puffer=''; laufend='';
  $('mitschrift').textContent='';
  if(nurBeenden||!text) return;
  const a=aufgabeAnlegen(text,zielBereich());
  if(a) melde('Angelegt: '+a.text,3000);
  else melde('Da war nichts Verwertbares dabei.',2500);
}

/* ============ Abgleich ============ */
let syncTimer=null, syncLaeuft=false;
function planeSync(){ clearTimeout(syncTimer); syncTimer=setTimeout(sync,1500); }

async function rpc(fn,body){
  const basis=cfg.url.replace(/\/+$/,'');
  const r=await fetch(basis+'/rest/v1/rpc/'+fn,{
    method:'POST',
    headers:{'apikey':cfg.key,'Authorization':'Bearer '+cfg.key,'Content-Type':'application/json'},
    body:JSON.stringify(body)
  });
  if(!r.ok) throw new Error(await r.text());
  const t=await r.text();
  return t?JSON.parse(t):null;
}
function verschmelze(a,b){
  const m=new Map();
  [...(a||[]),...(b||[])].forEach(x=>{ if(!x||!x.id) return; const v=m.get(x.id); if(!v||(x.ts||0)>(v.ts||0)) m.set(x.id,x); });
  return [...m.values()];
}
async function sync(still){
  if(!cfg.url||!cfg.key||!cfg.code||syncLaeuft) return;
  syncLaeuft=true;
  try{
    const fern=await rpc('sync_pull',{p_code:cfg.code})||{};
    doc.bereiche=verschmelze(doc.bereiche,fern.bereiche);
    doc.aufgaben=verschmelze(doc.aufgaben,fern.aufgaben);
    doc.vorlagen=verschmelze(doc.vorlagen,fern.vorlagen);
    doc.dateien=verschmelze(doc.dateien,fern.dateien);
    if(fern.notiz&&typeof fern.notiz==='object'&&(fern.notiz.ts||0)>((doc.notiz&&doc.notiz.ts)||0)) doc.notiz=fern.notiz;
    serienPruefen(); sichern(); zeichnen();
    const fernJson=JSON.stringify({bereiche:fern.bereiche||[],aufgaben:fern.aufgaben||[],vorlagen:fern.vorlagen||[],notiz:fern.notiz||{text:'',ts:0},dateien:fern.dateien||[]});
    if(JSON.stringify(doc)!==fernJson) await rpc('sync_push',{p_code:cfg.code,p_doc:doc});
    swKonfigSenden();
    if(!still) melde('Abgeglichen um '+new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}),2500);
    dateienAufraeumen();
  }catch(e){
    melde('Abgleich fehlgeschlagen. Einstellungen prüfen.',4000);
  }finally{ syncLaeuft=false; }
}

/* ============ Erinnerungen (Web Push) ============ */
let swReg=null;

function pushMoeglich(){ return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window; }
function b64zuBytes(b64){
  const s=(b64+'==='.slice((b64.length+3)%4)).replace(/-/g,'+').replace(/_/g,'/');
  const roh=atob(s), a=new Uint8Array(roh.length);
  for(let i=0;i<roh.length;i++) a[i]=roh.charCodeAt(i);
  return a;
}
function bytesZuB64(buf){
  const a=new Uint8Array(buf); let s='';
  a.forEach(x=>s+=String.fromCharCode(x));
  return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}

async function swStarten(){
  if(!pushMoeglich()) return null;
  try{
    swReg=await navigator.serviceWorker.register('./sw.js');
    await navigator.serviceWorker.ready;
    swKonfigSenden();
    return swReg;
  }catch(e){ return null; }
}
function swKonfigSenden(){
  if(!navigator.serviceWorker||!navigator.serviceWorker.controller) return;
  navigator.serviceWorker.controller.postMessage({typ:'cfg',cfg:{url:cfg.url,key:cfg.key,code:cfg.code}});
}

function pushMelde(t){
  const s=$('e-pushstand');
  if(s) s.textContent=t;
  melde(t,7000);
}

async function pushAnmelden(){
  if(!pushMoeglich()) return pushMelde('Dieser Browser kann keine Erinnerungen anzeigen.');
  if(!speicherBereit()) return pushMelde('Erst den Abgleich einrichten.');
  if(!cfg.vapid) return pushMelde('Es fehlt der öffentliche Schlüssel unter Zugangsdaten.');
  if(location.protocol!=='https:'&&location.hostname!=='localhost')
    return pushMelde('Erinnerungen brauchen eine https-Adresse.');

  pushMelde('Wird eingerichtet …');
  let erlaubnis;
  try{ erlaubnis=await Notification.requestPermission(); }
  catch(e){ return pushMelde('Die Nachfrage nach der Erlaubnis schlug fehl: '+(e&&e.message||e)); }
  if(erlaubnis!=='granted')
    return pushMelde('Benachrichtigungen wurden abgelehnt. In den Chrome-Einstellungen für diese Seite erlauben.');

  let reg;
  try{
    reg=await navigator.serviceWorker.register('./sw.js');
    await navigator.serviceWorker.ready;
    swReg=reg;
  }catch(e){
    return pushMelde('Der Hintergrunddienst (sw.js) ließ sich nicht laden: '+(e&&e.message||e));
  }

  let ab;
  try{
    ab=await reg.pushManager.getSubscription();
    if(ab){
      const alt=bytesZuB64(ab.options.applicationServerKey||new ArrayBuffer(0));
      if(alt!==cfg.vapid){ await ab.unsubscribe(); ab=null; }
    }
    if(!ab) ab=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64zuBytes(cfg.vapid)});
  }catch(e){
    return pushMelde('Anmeldung beim Push-Dienst fehlgeschlagen – meist stimmt der öffentliche Schlüssel nicht: '+(e&&e.message||e));
  }

  try{
    const j=ab.toJSON();
    await rpc('push_anmelden',{p_code:cfg.code,p_endpoint:j.endpoint,
      p_p256dh:j.keys?j.keys.p256dh:'',p_auth:j.keys?j.keys.auth:'',
      p_geraet:(navigator.userAgent.match(/Android|iPhone|iPad|Macintosh|Windows/)||['Gerät'])[0]});
  }catch(e){
    return pushMelde('Das Gerät ließ sich nicht in der Datenbank vermerken. Wurde push_setup.sql ausgeführt? '+(e&&e.message||e));
  }

  cfg.push=true; sichern(); swKonfigSenden();
  melde('Erinnerungen sind auf diesem Gerät aktiv.',4000);
  blattZu();
}

async function pushAbmelden(){
  try{
    const reg=swReg||await navigator.serviceWorker.getRegistration();
    const ab=reg&&await reg.pushManager.getSubscription();
    if(ab){ await rpc('push_abmelden',{p_code:cfg.code,p_endpoint:ab.endpoint}).catch(()=>{}); await ab.unsubscribe(); }
  }catch(e){}
  cfg.push=false; sichern(); blattZu();
  melde('Erinnerungen auf diesem Gerät abgeschaltet.',3500);
}

/* ============ Einstellungen ============ */
$('btn-einst').onclick=()=>{
  const verbunden=!!(cfg.url&&cfg.key&&cfg.code);
  blattAuf(`<h3>Einstellungen</h3>
    <label>Erscheinungsbild</label>
    <div class="wahl">
      <button data-t="hell" aria-pressed="${cfg.thema!=='dunkel'}">Hell</button>
      <button data-t="dunkel" aria-pressed="${cfg.thema==='dunkel'}">Dunkel</button>
    </div>
    <label>Sicherungskopie</label>
    <div class="schnell"><button id="e-exp">Als Datei sichern</button><button id="e-imp">Datei laden</button></div>
    <label>Erinnerungen auf diesem Gerät</label>
    <p class="hinweis" style="margin:0 0 10px" id="e-pushstand">…</p>
    <div class="knopfreihe" style="margin-top:0" id="e-pushreihe"></div>
    <label>Abgleich</label>
    <p class="hinweis" style="margin:0 0 10px">${verbunden?'Eingerichtet und aktiv.':'Noch nicht eingerichtet.'}</p>
    <div class="knopfreihe" style="margin-top:0">
      ${verbunden?'<button class="knopf" id="e-jetzt">Jetzt abgleichen</button>':''}
      <button class="knopf leise" id="e-zeig">Zugangsdaten …</button>
    </div>
    <div class="knopfreihe"><button class="knopf voll" id="e-ab">Schließen</button></div>`);

  $('blatt').querySelectorAll('.wahl button').forEach(b=>b.onclick=()=>{
    setzeThema(b.dataset.t);
    $('blatt').querySelectorAll('.wahl button').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.t===cfg.thema)));
  });
  $('e-exp').onclick=()=>{
    const b=new Blob([JSON.stringify(doc,null,2)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(b);
    a.download='todo-'+isoHeute()+'.json'; a.click(); URL.revokeObjectURL(a.href);
  };
  $('e-imp').onclick=()=>$('datei').click();

  (async()=>{
    const stand=$('e-pushstand'), reihe=$('e-pushreihe');
    if(!stand) return;
    if(!pushMoeglich()){ stand.textContent='Dieser Browser unterstützt keine Erinnerungen. Am Rechner Chrome oder Edge verwenden.'; return; }
    if(!verbunden){ stand.textContent='Erst den Abgleich einrichten.'; return; }
    if(!cfg.vapid){ stand.textContent='Es fehlt der öffentliche Schlüssel – unter Zugangsdaten eintragen.'; return; }
    if(Notification.permission==='denied'){
      stand.textContent='Benachrichtigungen sind für diese Seite blockiert. Bitte in den Browser-Einstellungen erlauben.'; return; }
    const reg=await navigator.serviceWorker.getRegistration();
    const ab=reg&&await reg.pushManager.getSubscription();
    if(ab&&Notification.permission==='granted'){
      stand.textContent='Aktiv. Aufgaben mit Uhrzeit melden sich von selbst.';
      reihe.innerHTML='<button class="knopf leise" id="e-pushaus">Abschalten</button>';
      $('e-pushaus').onclick=pushAbmelden;
    }else{
      stand.textContent='Noch nicht aktiv. Erinnerungen kommen nur für Aufgaben mit Uhrzeit.';
      reihe.innerHTML='<button class="knopf" id="e-pushan">Auf diesem Gerät aktivieren</button>';
      $('e-pushan').onclick=pushAnmelden;
    }
  })();
  if(verbunden) $('e-jetzt').onclick=()=>{ blattZu(); sync(); };
  $('e-zeig').onclick=blattZugang;
  $('e-ab').onclick=blattZu;
};

function blattZugang(){
  blattAuf(`<h3>Zugangsdaten</h3>
    <p class="hinweis" style="margin:0 0 14px">Diese Angaben verbinden Handy und Rechner.
    Bitte nur ändern, wenn du weißt, was du tust – ohne sie ist kein Abgleich möglich.</p>
    <div class="knopfreihe" style="margin-top:0"><button class="knopf" id="z-frei">Zum Bearbeiten freigeben</button>
    <button class="knopf voll" id="z-zurueck">Zurück</button></div>
    <div id="z-feld" hidden>
      <label>Supabase Projekt-URL</label>
      <input type="text" id="e-url" value="${esc(cfg.url)}" placeholder="https://xxxx.supabase.co" autocapitalize="off" spellcheck="false" disabled>
      <label>anon key</label>
      <input type="text" id="e-key" value="${esc(cfg.key)}" placeholder="eyJhbGci…" autocapitalize="off" spellcheck="false" disabled>
      <label>Sync-Code (auf allen Geräten identisch)</label>
      <input type="text" id="e-code" value="${esc(cfg.code)}" placeholder="mindestens 12 Zeichen" autocapitalize="off" spellcheck="false" disabled>
      <div class="schnell"><button id="e-gen">Code erzeugen</button><button id="e-kopie">Code kopieren</button></div>
      <label>Öffentlicher Schlüssel für Erinnerungen</label>
      <input type="text" id="e-vapid" value="${esc(cfg.vapid||'')}" placeholder="B… (aus vapid.html)" autocapitalize="off" spellcheck="false" disabled>
      <div class="knopfreihe">
        <button class="knopf voll" id="e-ok">Speichern &amp; abgleichen</button>
        <button class="knopf" id="e-verwerf">Verwerfen</button>
      </div>
      <p class="hinweis">Der Sync-Code ist das Passwort für deine Liste. Wer ihn kennt, sieht die Aufgaben.
      Notiere ihn dir an einem sicheren Ort.</p>
    </div>`);

  $('z-zurueck').onclick=()=>$('btn-einst').click();
  $('z-frei').onclick=()=>{
    $('z-feld').hidden=false;
    ['e-url','e-key','e-code','e-vapid'].forEach(i=>$(i).disabled=false);
    $('z-frei').remove();
  };
  $('e-gen').onclick=()=>{
    const z='abcdefghijkmnpqrstuvwxyz23456789'; let s='';
    const a=new Uint8Array(20); crypto.getRandomValues(a);
    a.forEach(x=>s+=z[x%z.length]);
    $('e-code').value=s;
  };
  $('e-kopie').onclick=async()=>{
    try{ await navigator.clipboard.writeText($('e-code').value); melde('Code kopiert.',2000); }
    catch(e){ $('e-code').select(); }
  };
  $('e-verwerf').onclick=()=>$('btn-einst').click();
  $('e-ok').onclick=()=>{
    const u=$('e-url').value.trim(), k=$('e-key').value.trim(), co=$('e-code').value.trim();
    if(co&&co.length<12) return melde('Der Sync-Code muss mindestens 12 Zeichen haben.',4000);
    cfg.url=u; cfg.key=k; cfg.code=co; cfg.vapid=$('e-vapid').value.trim();
    sichern(); blattZu();
    if(cfg.url&&cfg.key&&cfg.code) sync(); else melde('Gespeichert. Abgleich ist noch nicht eingerichtet.',3000);
  };
}
$('datei').onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const n=JSON.parse(r.result);
      doc.bereiche=verschmelze(doc.bereiche,n.bereiche);
      doc.aufgaben=verschmelze(doc.aufgaben,n.aufgaben);
      doc.vorlagen=verschmelze(doc.vorlagen,n.vorlagen);
      if(n.notiz&&typeof n.notiz==='object'&&(n.notiz.ts||0)>((doc.notiz&&doc.notiz.ts)||0)) doc.notiz=n.notiz;
      blattZu(); geaendert(); melde('Daten übernommen.',2500);
    }catch(err){ melde('Diese Datei passt nicht.',3000); }
  };
  r.readAsText(f); e.target.value='';
};

/* ============ Teilen-Ziel / Start ============ */
(function start(){
  setzeThema(cfg.thema);
  doc.aufgaben.forEach((a,i)=>{ if(typeof a.pos!=='number') a.pos=i*10; });
  const p=new URLSearchParams(location.search);
  const geteilt=[p.get('title'),p.get('text'),p.get('url')].filter(Boolean).join(' ').trim();
  if(geteilt){ aufgabeAnlegen(geteilt,cfg.ziel); history.replaceState({},'',location.pathname); }
  ansicht=cfg.ansicht||'heute';
  if(ansicht==='bereich') ansicht='bereiche';
  $('logo').onclick=()=>{ offenerBereich=null; setzeAnsicht('heute'); };
  zeichnen();
  sync(true);
  swStarten();
})();

document.addEventListener('visibilitychange',()=>{ if(!document.hidden){ zeichnen(); sync(true); } });
setInterval(()=>{ if(!document.hidden) sync(true); },45000);
</script>
